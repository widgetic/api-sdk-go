  /users/{userId}/adapter-connections:
    get:
      description: |
        Widget adapters are capabilities a widget can use, and some of them act through a service the owner has an
        account with: an adapter that sends email needs the owner's email provider key, one that sends texts needs the
        owner's SMS provider key. This lists every key an adapter takes from an owner and whether this account has
        connected it, so a settings page can show what is missing.

        An empty list means no adapter takes a key from an owner at the moment. The list never contains a key: only
        whether one is connected and when it was last set.

        Connect a key with `setUserAdapterConnection`; take it away with `removeUserAdapterConnection`. The widgets of
        customers a partner manages use the partner's keys instead (`getPartnerAdapterConnections`).

        The caller must be the account itself (an API key of that account works, with the `account:read` scope), or a
        Widgetic administrator.
      operationId: getUserAdapterConnections
      parameters:
      - description: "The account whose adapter keys to list. For your own, your own\
          \ user id"
        explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getUserAdapterConnections_200_response'
          description: "Every key an adapter takes from an owner, connected or not"
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account id is not a valid id
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The keys belong to another account
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many requests. Wait a minute.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Adapter keys cannot be read on this server right now (ADAPTER_CONNECTIONS_UNAVAILABLE)
      security:
      - apiKeyAuth: []
      summary: See which adapter keys an account has connected
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, UsersApi } from '@widgetic/api-sdk';

          const usersApi = new UsersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          const connections = await usersApi.getUserAdapterConnections({ userId });
          const missing = connections.filter((connection) => !connection.connected);
          console.log(missing.map((connection) => connection.label));
  /users/{userId}/adapter-connections/{adapterId}/{credentialKey}:
    delete:
      description: |
        Removes a key an adapter was given. The adapter stops working for the widgets that need it: their visitors are
        told the feature is unavailable. Nothing else of the widgets changes, and connecting a key again brings them
        back.

        Removing a key that is not connected answers 200 with `removed: false`: the state asked for is the state it is
        in. A key of an adapter that has since been retired from the catalog can still be removed.

        This needs an API key with full access. The caller must be the account itself or a Widgetic administrator.
      operationId: removeUserAdapterConnection
      parameters:
      - description: "The account that keeps the key. For your own, your own user\
          \ id"
        explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The adapter the key is for
        explode: false
        in: path
        name: adapterId
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      - description: The key's name within the adapter
        explode: false
        in: path
        name: credentialKey
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/removeUserAdapterConnection_200_response'
          description: The key is not connected any more
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A path value is malformed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The key belongs to another account, or the API key has not\
            \ full access"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many changes in a short time. Try again after the Retry-After
            seconds.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Adapter keys cannot be changed on this server right now (ADAPTER_CONNECTIONS_UNAVAILABLE).
            Nothing was changed
      security:
      - apiKeyAuth: []
      summary: Remove an adapter key from an account
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, UsersApi } from '@widgetic/api-sdk';

          const usersApi = new UsersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          const { removed } = await usersApi.removeUserAdapterConnection({
            userId,
            adapterId: 'email',
            credentialKey: 'resendApiKey',
          });
    put:
      description: |
        Gives an adapter the key it needs to act through a service you have an account with, for the widgets you made.
        Take the `adapterId` and `credentialKey` from `getUserAdapterConnections`. Saving a key that is already
        connected replaces it.

        **What Widgetic does with it.** The key is stored encrypted, bound to this account, this adapter and this
        credential, so that a stored value cannot be moved to another. It is never returned, never logged and never
        shown to a visitor of a widget. A server of Widgetic opens it for the one call a widget makes through the
        adapter, uses it to call the provider on your behalf, and discards it. To cut that off, remove the key here, or
        revoke it with the provider.

        **What is checked.** That the adapter exists and takes this credential, that an owner may keep it (some are
        for a partner only) and that the text is one line of at most 2048 characters. Whether the provider accepts
        the key is not checked here: it shows the first time a widget uses it, and the widget tells its owner.

        A widget whose adapter has no key connected is not charged and does not run that adapter: its visitors are told
        the feature is unavailable, and the owner is told once a day what to connect.

        This needs an API key with full access. The caller must be the account itself or a Widgetic administrator. A
        retry is harmless: saving the same key twice only refreshes when it was set.
      operationId: setUserAdapterConnection
      parameters:
      - description: "The account that keeps the key. For your own, your own user\
          \ id"
        explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The adapter the key is for
        explode: false
        in: path
        name: adapterId
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      - description: The key's name within the adapter
        explode: false
        in: path
        name: credentialKey
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdapterConnectionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/setUserAdapterConnection_200_response'
          description: The key was saved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A path value or the body is malformed. The body takes exactly\
            \ one field, `credential`"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The key belongs to another account, or the API key has not\
            \ full access"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "There is no such adapter, the adapter has no such credential,\
            \ an owner may not keep it, or the account does not exist (ADAPTER_NOT_FOUND,\
            \ CREDENTIAL_NOT_FOUND, CREDENTIAL_NOT_FOR_THIS_ACCOUNT, HOLDER_NOT_FOUND)"
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credential is not one line of text of at most 2048 characters
            (CREDENTIAL_VALUE_INVALID). Nothing was saved
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many changes in a short time. Try again after the Retry-After
            seconds.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Adapter keys cannot be saved on this server right now (ADAPTER_CONNECTIONS_UNAVAILABLE).
            Nothing was changed
      security:
      - apiKeyAuth: []
      summary: Connect an adapter key to an account
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, UsersApi } from '@widgetic/api-sdk';

          const usersApi = new UsersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          const connection = await usersApi.setUserAdapterConnection({
            userId,
            adapterId: 'email',
            credentialKey: 'resendApiKey',
            setAdapterConnectionRequest: { credential: 'YOUR_PROVIDER_KEY' },
          });
          console.log(connection.connected, connection.updatedAt);
