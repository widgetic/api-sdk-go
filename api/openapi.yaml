    AccountCreditBalance:
      description: |
        The credits an account holds. Credits are held per user, so the same balance applies in a personal workspace and in an organization the user belongs to.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        balance: 42
        reservedBalance: 42
        lastUpdated: 2026-01-15T09:30:00.000Z
      properties:
        id:
          format: uuid
          type: string
        userId:
          format: uuid
          type: string
        balance:
          description: Credits the account holds
          type: number
        reservedBalance:
          description: |
            Credits committed to an operation that is still running. They cannot be spent, so what a new operation can use is `balance - reservedBalance`.
          type: number
        lastUpdated:
          format: date-time
          type: string
      type: object
    AccountCreditTransaction:
      description: One entry of an account's credit ledger.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        transactionType: Example transactionType
        amount: 42
        balanceAfter: 42
        description: Example description
        referenceId: Example referenceId
        createdAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          format: uuid
          type: string
        transactionType:
          description: |
            What the entry did to the balance. `debit` is credits spent (this is how consumption shows), `credit` and `subscription` are credits added, `refund` returns credits that were spent, `reserve` and `release` move credits in and out of the reserved amount, and `adjustment`, `expiration`, `transfer_out` and `transfer_in` are the remaining ways a balance changes. The list can grow, so treat an unknown type as an entry you do not need to interpret.
          nullable: true
          type: string
        amount:
          description: Always positive. The `transactionType` says whether the credits
            were added or taken.
          type: number
        balanceAfter:
          description: The balance once this entry was applied
          nullable: true
          type: number
        description:
          nullable: true
          type: string
        referenceId:
          description: The event the entry belongs to. An entry is recorded once per
            reference.
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
      type: object
    Composition:
      example:
        id: 123e4567-e89b-12d3-a456-426614174000
        creatorId: 123e4567-e89b-12d3-a456-426614174001
        widgetId: 123e4567-e89b-12d3-a456-426614174002
        name: My Composition
        content:
          key: value
        contentVersion: 3
        status: draft
        createdAt: 2023-01-01T00:00:00Z
        updatedAt: 2023-01-02T00:00:00Z
        embedSettings:
          width: 100%
          height: 500px
        design:
          theme: light
          colors:
            primary: '#0066ff'
        databaseId: 123e4567-e89b-12d3-a456-426614174003
        projectId: 123e4567-e89b-12d3-a456-426614174004
        managedUserId: b7c8d9e0-1f2a-4b3c-8d4e-5f6a7b8c9d0e
        direct: true
      properties:
        id:
          description: Unique identifier for the composition
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        creatorId:
          description: ID of the user who created the composition
          example: 123e4567-e89b-12d3-a456-426614174001
          format: uuid
          type: string
        widgetId:
          description: ID of the widget this composition is based on
          example: 123e4567-e89b-12d3-a456-426614174002
          format: uuid
          type: string
        name:
          description: Name of the composition
          example: My Composition
          type: string
        content:
          description: Content data for the composition
          example:
            key: value
          type: object
        contentVersion:
          description: Monotonic content version when the content_version migration
            is applied
          example: 3
          type: integer
        status:
          description: Current status of the composition
          enum:
          - draft
          - published
          - archived
          example: draft
          type: string
        createdAt:
          description: When the composition was created
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        updatedAt:
          description: When the composition was last updated
          example: 2023-01-02T00:00:00Z
          format: date-time
          type: string
        embedSettings:
          description: Settings for embedding the composition
          example:
            width: 100%
            height: 500px
          type: object
        design:
          description: Design settings for the composition
          example:
            theme: light
            colors:
              primary: '#0066ff'
          type: object
        databaseId:
          description: "Legacy. The id of a Neon database that an earlier version\
            \ made for this composition. A composition now keeps its tables in a schema\
            \ of its own (named `comp_` followed by its id) in a database shared with\
            \ other compositions, so new compositions have none."
          example: 123e4567-e89b-12d3-a456-426614174003
          format: uuid
          type: string
        projectId:
          description: ID of the project this composition belongs to
          example: 123e4567-e89b-12d3-a456-426614174004
          format: uuid
          type: string
        managedUserId:
          description: "The managed user the composition was made for, or null when\
            \ it is your own. List one managed user's compositions with the `managedUserId`\
            \ or `managedUserExternalId` query parameter of `getAllCompositions`."
          example: b7c8d9e0-1f2a-4b3c-8d4e-5f6a7b8c9d0e
          format: uuid
          nullable: true
          type: string
        direct:
          description: |
            Whether the widget the composition is made from is drawn straight into the page, without a frame
            (`true`), or inside a frame (`false`). `null` when the widget has no published version yet. It is a
            fact about the widget's published version, so every composition of one widget answers the same, and it
            changes when you publish another version. It cannot be set. Only `getCompositionById` returns it:
            the other calls that return a composition leave it out, and so does that one on the rare occasion the
            answer could not be worked out just then (ask again).
          example: true
          nullable: true
          type: boolean
      required:
      - content
      - createdAt
      - creatorId
      - id
      - name
      - status
      - updatedAt
      - widgetId
      type: object
    NewComposition:
      example:
        name: My New Composition
        widgetId: 123e4567-e89b-12d3-a456-426614174002
        creatorId: 123e4567-e89b-12d3-a456-426614174001
        content:
          key: value
        status: draft
        embedSettings:
          width: 100%
          height: 500px
        design:
          theme: light
          colors:
            primary: '#0066ff'
        databaseSchema:
          tables:
          - name: votes
            columns:
            - name: id
              type: serial
              primaryKey: true
            - name: choice
              type: text
              notNull: true
            - name: created_at
              type: timestamptz
              default: now()
            indexes:
            - name: votes_choice_idx
              columns:
              - choice
        projectId: 123e4567-e89b-12d3-a456-426614174004
        managedUserId: b7c8d9e0-1f2a-4b3c-8d4e-5f6a7b8c9d0e
        managedUserExternalId: user-8841
      properties:
        name:
          description: Name of the composition
          example: My New Composition
          type: string
        widgetId:
          description: ID of the widget this composition is based on
          example: 123e4567-e89b-12d3-a456-426614174002
          format: uuid
          type: string
        creatorId:
          description: ID of the user creating the composition
          example: 123e4567-e89b-12d3-a456-426614174001
          format: uuid
          type: string
        content:
          description: Content data for the composition
          example:
            key: value
          type: object
        status:
          default: draft
          description: Initial status of the composition
          example: draft
          type: string
        embedSettings:
          description: Settings for embedding the composition
          example:
            width: 100%
            height: 500px
          type: object
        design:
          description: Design settings for the composition
          example:
            theme: light
            colors:
              primary: '#0066ff'
          type: object
        databaseSchema:
          description: |
            The tables this composition keeps what visitors send it in (votes, ratings, answers). They are made when
            the composition is created, in a schema of their own that no other composition can reach: in Widgetic's
            database, or in your own Neon database when you have set one with `setPartnerDataDatabase`. They are
            deleted with the composition.

            The shape is `{ "tables": [ ... ] }`. A table has a `name`, a list of `columns` and, optionally, a list of
            `indexes`. A column has a `name` and a `type`, and optionally `primaryKey`, `notNull`, `unique` and
            `default`. An index has a `name` and the `columns` it covers (1 to 8), and optionally `unique`. Any other
            key is refused.

            - Names (tables, columns, indexes) use lower-case letters, digits and underscores, start with a letter and
              are at most 63 characters long. A name that starts with `_` or `pg_` is reserved.
            - `type` is one of `text`, `smallint`, `integer` (or `int`), `bigint`, `numeric`, `real`,
              `double precision`, `boolean` (or `bool`), `date`, `timestamp`, `timestamptz` (or
              `timestamp with time zone`), `uuid`, `json`, `jsonb`, `serial`, `bigserial`.
            - `default` is a number, `true` or `false`, a text of at most 500 characters (no backslash), a JSON value
              for a `json` or `jsonb` column, or one of `now()`, `current_timestamp` and `current_date` (date and
              timestamp columns) and `gen_random_uuid()` (a `uuid` column). A `serial` column numbers itself and has
              no default.
            - A composition declares at most 20 tables, with at most 64 columns and 10 indexes each.

            A declaration that cannot be used is refused with `400` and `INVALID_DATABASE_SCHEMA`;
            `error.details.problems` lists what to change. Tables that already exist are never changed or dropped:
            sending more tables later, when you update the composition, adds the ones that are missing. When the
            composition is saved but its tables cannot be made just now, the answer says so in `meta.warnings`: send
            the same `databaseSchema` again to retry.

            Leave it out and the composition gets the tables its widget declares in its own source
            (`src/lib/meta/database.json`), if any. Send `{ "tables": [] }` to give the composition no tables and
            keep it from getting its widget's.
          example:
            tables:
            - name: votes
              columns:
              - name: id
                type: serial
                primaryKey: true
              - name: choice
                type: text
                notNull: true
              - name: created_at
                type: timestamptz
                default: now()
              indexes:
              - name: votes_choice_idx
                columns:
                - choice
          type: object
        projectId:
          description: ID of the project this composition belongs to
          example: 123e4567-e89b-12d3-a456-426614174004
          format: uuid
          type: string
        managedUserId:
          description: "Make the composition for one of your managed users, by Widgetic's\
            \ id for the user. Send this or `managedUserExternalId`, not both. The\
            \ managed user must be yours and active. The composition stays in your\
            \ account; the tag lets you list one user's compositions and keeps it\
            \ out of the others' lists. It is set here and does not change afterwards."
          example: b7c8d9e0-1f2a-4b3c-8d4e-5f6a7b8c9d0e
          format: uuid
          type: string
        managedUserExternalId:
          description: "The same, by your own identifier for the user, the `externalId`\
            \ you gave when you created the managed user (answers show it as `externalId`).\
            \ Send this or `managedUserId`, not both."
          example: user-8841
          maxLength: 255
          type: string
      required:
      - name
      - widgetId
      type: object
    UpdateComposition:
      example:
        name: Updated Composition Name
        widgetId: 123e4567-e89b-12d3-a456-426614174002
