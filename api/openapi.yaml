      required:
      - columns
      - name
      - rows
      type: object
    CompositionEntriesDescription:
      example:
        compositionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        hasData: true
        tables:
        - Example CompositionEntryTable
      properties:
        compositionId:
          description: The composition whose entries these are
          format: uuid
          type: string
        hasData:
