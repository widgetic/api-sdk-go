          \ you retry this call.\n    async ({ init }) => ({ headers: { ...init.headers,\
          \ 'Idempotency-Key': randomUUID() } })\n  );\n  \n  console.log('Created\
          \ managed user:', managedUser);\n} catch (error) {\n  console.error('Failed\
          \ to create managed user:', error);\n}\n"
