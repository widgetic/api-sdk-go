    AiAnswersKnowledgeDocument:
      description: "One document in a widget's knowledge base: what the widget's AI\
        \ answers visitors' questions from. Its text is not part of this: it is kept\
        \ so the widget can find the passages that answer a question, and is never\
        \ returned."
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title: Shipping and returns
        status: Example status
        charCount: 4210
        chunkCount: 6
        createdAt: 2026-01-15T09:30:00.000Z
        readyAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          description: Use it to remove the document
          format: uuid
          type: string
        title:
          description: "What the document is called. Visitors see it as the source\
            \ of an answer, so write it for them"
          example: Shipping and returns
          maxLength: 120
          type: string
        status:
          description: "`ready` documents are used to answer questions. A `processing`\
            \ document is not: it is being added, or an add was interrupted. Remove\
            \ one that stays in this state and add it again"
          enum:
          - processing
          - ready
          type: string
        charCount:
          description: "How many characters of text the document holds, after it was\
            \ cleaned"
          example: 4210
          type: integer
        chunkCount:
          description: Into how many passages the text was cut. Zero until the document
            is ready
          example: 6
          type: integer
        createdAt:
          format: date-time
          type: string
        readyAt:
          description: When the document became ready. Null while it is not
          format: date-time
          nullable: true
          type: string
      required:
      - charCount
      - chunkCount
      - createdAt
      - id
      - readyAt
      - status
      - title
      type: object
