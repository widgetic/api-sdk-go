          type: string
        style: simple
      - description: Number of transactions to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Number of transactions to skip
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: |
          Only entries of this type, for instance `debit` for the credits spent. The types are listed on `AccountCreditTransaction`.
        explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPartnerCreditTransactions_200_response'
          description: "The partner's ledger entries, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (a Widgetic administrator asked for
            an id that does not exist)
      security:
      - apiKeyAuth: []
      summary: Get partner credit transaction history
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
  /partners/{partnerId}/credits/extra-invoice:
    post:
      description: |
        Asks Widgetic for an invoice for extra credits, on top of the credits of the contract. Name the dollars; the
        invoice is for the most whole credits they buy at the **list price** of a credit (the price a contract may
        lower belongs to the contract), so it is never for more than you asked: 12.34 buys 123 credits and the invoice
        says 12.30. The smallest purchase is 10 dollars and one request buys at most 100000 (ask Widgetic for an
        invoice for more).

        Pay the invoice with the link in the answer. When it is paid the credits are added **once, for good**, to the
        account of the person who administers the partner, which is the account everything the partner builds is
        charged to (`getPartnerCreditBalance` shows it). Extra credits **do not expire**, unlike the credits of a
        contract period, which end with it. Nothing is added before the invoice is paid, and an unpaid invoice for
        extra credits never stops the partner: only an unpaid invoice of the contract does (`payment_arrears`).

        Allowed whatever the partner's standing: a partner that has run out of credits, or is stopped for an unpaid
        contract invoice, can still buy. No contract is needed.

        An `Idempotency-Key` is required, and it is what makes a retry safe: the same key with the same body returns
        the invoice already issued, the same key with a different body is refused with 422, and a duplicate that
        arrives while the first is still running is refused with 409. Use one key per purchase you mean to make, and
        a new key for the next one. At most 10 requests an hour.

        Who may ask: the person who administers the partner, or a Widgetic administrator. A key limited to scopes
        needs `billing:write`.
      operationId: createPartnerExtraCreditsInvoice
      parameters:
      - description: Partner ID
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "A key of your own for this purchase, so that a retry cannot\
          \ make a second invoice"
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 50
          minLength: 8
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestExtraCredits'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerExtraCreditsInvoiceResponse'
          description: The invoice was issued
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The amount is not a number of dollars and cents, is under\
            \ 10 or over 100000, or the Idempotency-Key header is missing or malformed"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (a Widgetic administrator asked for
            an id that does not exist)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Another request with this Idempotency-Key is still running
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "This Idempotency-Key was already used with a different body,\
            \ the partner has no administrator account to add the credits to (`NO_PARTNER_ADMINISTRATOR`),\
            \ there is no billing email and no contact email to send the invoice to\
            \ (`NO_BILLING_EMAIL`), or Stripe did not accept the tax ID on the billing\
            \ profile (`TAX_ID_INVALID`)"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many requests; at most 10 an hour
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Stripe could not issue the invoice. Nothing was sent; retry
            with the same Idempotency-Key.
      security:
      - apiKeyAuth: []
      summary: Buy extra credits for a partner
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
  /partners/{partnerId}/billing-overview:
    get:
      description: |
        Retrieves the partner's credits (`operationalCredits`), the partner's contract terms (`partnerCustomization`, the same fields as `getPartnerContract`) and billing integration status. Internal negotiation notes are not part of it.
        `operationalCredits` is the one account a partner has for its credits: the account of the person who administers it. It holds `balance` (the same balance `getPartnerCreditBalance` reads), `reservedBalance`, `availableBalance` (what a new operation can use) and `recentTransactions` (the ten newest entries of the ledger `getPartnerCreditTransactions` lists). A partner with no administrator has no account, and reads 0 and an empty list.
      operationId: getPartnerBillingOverview
      parameters:
