  /partners/{partnerId}/storage/usage:
    get:
      description: |
        Says how many files, and how many bytes, your account keeps, in total and for each of your managed users, and
        how much of it is in Widgetic's storage and how much in your own storage destination
        (`setPartnerStorageDestination`). Use it to see which customers store the most, or to charge them for it.

        A file is counted for a managed user when it was filed under that user: by naming `managed_user_id` or
        `managed_user_external_id` when you upload it (`uploadsPost`, or the metadata of a resumable upload), or
        because it was uploaded through that user's editor session, which files everything under its user. The files
        that are not filed under anyone (your own, and the ones uploaded without naming a managed user) are the row
        whose `managedUserId` is null. Deleted files are not counted. To list the files of one managed user, use the
        `managed_user_id` filter of `uploadsGet`.

        The answer is counted when you ask, so it is always current. The groups are ordered by size, the heaviest
        first, and `page.hasMore` says whether more follow.

        The caller must be the person who administers the partner (an API key of that account works, with the
        `partner:read` scope), or a Widgetic administrator.
      operationId: getPartnerStorageUsage
      parameters:
      - description: The partner whose storage to report on
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: How many managed users to list at most
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: How many managed users to skip
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 100000
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerStorageUsageResponse'
          description: What the partner's customers store
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A query value is not valid
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (reported to administrators only)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The partner has no administrator account (PARTNER_HAS_NO_ADMINISTRATOR)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many report requests. Wait a minute.
      security:
      - apiKeyAuth: []
      summary: What a partner's customers store
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, PartnersApi } from '@widgetic/api-sdk';

          const partnersApi = new PartnersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          // What each customer stores, the heaviest first:
          const usage = await partnersApi.getPartnerStorageUsage({ partnerId });

          console.log(usage.totals.totalBytes);
          for (const customer of usage.managedUsers) {
            console.log(customer.externalId, customer.totalBytes);
          }
  /partners/{partnerId}/analytics/summary:
    get:
      description: |
        Counts what the visitors of the compositions made through your account did in a period: how many times a
        composition was **viewed**, how many times a visitor **interacted** with one, and how many different visitors
        there were. It covers every composition of your account, your own and the ones made for your managed users;
        narrow it to one managed user with `managedUserId` or `managedUserExternalId` (not both).

        The numbers come from the events the embedded widgets send while they are shown (the Widgetic embed SDK sends
        them by itself), counted when you ask. Only views and interactions are counted; the events that describe a
        visit (its start, its end, the device and the referrer) are not.

        The period runs from `startDate` (included) to `endDate` (not included): the 30 days before now when you give
        neither, and at most 366 days. A date without a time is midnight UTC at the start of that day, so for all of
        October give `startDate=2026-10-01` and `endDate=2026-11-01`.

        The caller must be the person who administers the partner (an API key of that account works, with the
        `partner:read` scope), or a Widgetic administrator.
      operationId: getPartnerAnalyticsSummary
      parameters:
      - description: The partner whose widgets to report on
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: |
          Start of the period, included. An ISO 8601 date (`2026-10-01`) or date-time with its offset (`2026-10-01T08:00:00Z`). Default 30 days before `endDate`.
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          type: string
        style: form
      - description: |
          End of the period, not included, in the same forms. Default now. It must be after `startDate`, by at most 366 days.
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          type: string
        style: form
      - description: "Report only on this managed user (Widgetic's id for the user).\
          \ Send this or `managedUserExternalId`, not both."
        explode: true
        in: query
        name: managedUserId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "Report only on the managed user you registered with this `externalId`\
          \ (your own identifier for the user). Send this or `managedUserId`, not\
          \ both."
        explode: true
        in: query
        name: managedUserExternalId
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAnalyticsSummaryResponse'
          description: What was done with the widgets in the period
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A date is not a date, `startDate` is not before `endDate`,\
            \ the period is longer than 366 days, or the managed user is named wrongly"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "There is no such partner (reported to administrators only),\
            \ or no managed user of yours matches (MANAGED_USER_NOT_FOUND)"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The partner has no administrator account (PARTNER_HAS_NO_ADMINISTRATOR)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many report requests. Wait a minute.
      security:
      - apiKeyAuth: []
      summary: What was done with a partner's published widgets
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, PartnersApi } from '@widgetic/api-sdk';

          const partnersApi = new PartnersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          // How the widgets of one customer did in October:
          const summary = await partnersApi.getPartnerAnalyticsSummary({
            partnerId,
            startDate: '2026-10-01',
            endDate: '2026-11-01',
            managedUserExternalId: 'customer-4711'
          });

          console.log(summary.views, summary.interactions, summary.visitors);
