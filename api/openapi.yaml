  /managed-users/{id}/usage:
    get:
      description: |
        Says how many credits the editor sessions of one of your managed users took from your account over a
        period, in total and for each operation. A generation costs one credit, taken from your account when it
        starts; one that fails is refunded and is counted as refunded, not as spent.

        Only what was spent through editor sessions is here, and only since usage was first recorded: what you
        spend with your API key, and anything from before, is not. Use it to see which of your users spend the
        most, or to charge them for it. To hold one session to a number of credits, set `max_credits` when you
        make it (`createManagedUserEditorSession`).

        The period runs from `startDate` (included) to `endDate` (not included): the 30 days before now when you
        give neither, and at most 366 days. A date without a time is midnight UTC at the start of that day, so for
        all of October give `startDate=2026-10-01` and `endDate=2026-11-01`.
      operationId: getManagedUserUsage
      parameters:
      - description: The managed user whose usage you want (Widgetic's id for the
          user)
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: |
          Start of the period, included: an ISO 8601 date (`2026-10-01`) or date-time with its offset (`2026-10-01T08:00:00Z`). Default: 30 days before `endDate`.
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          type: string
        style: form
      - description: |
          End of the period, not included, in the same forms. Default: now. It must be after `startDate`, by at most 366 days.
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserUsageResponse'
          description: What the managed user's editor sessions spent in the period
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A date is not a date, `startDate` is not before `endDate`,\
            \ or the period is longer than 366 days"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - the caller is not a partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No managed user with this id on your account (`MANAGED_USER_NOT_FOUND`).
            Another partner's managed user answers 404 as well.
      security:
      - apiKeyAuth: []
      summary: What a managed user's editor sessions spent
      tags:
      - Partner
      - Managed Users
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, ManagedUsersApi } from '@widgetic/api-sdk';

          const managedUsersApi = new ManagedUsersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          // What this user's editor sessions spent in October:
          const usage = await managedUsersApi.getManagedUserUsage({
            id: managedUserId,
            startDate: '2026-10-01',
            endDate: '2026-11-01'
          });

          console.log(usage.totals.credits, usage.operations);
  /managed-users/{id}/presets/{key}/copy:
    post:
      description: |
        Copies the preset `key` (see `setPartnerPreset`) onto a new canvas for one of your managed users, so their
        widget creator opens on a widget of their own that starts from yours. The copy is a draft widget in your
        account, filed under the managed user: `getAllWidgets` with `managedUserId` lists it, and no other managed
        user's editor can reach it.

        The copy carries the preset's code, design and content schemas, and thumbnail, and starts from a fork of its
        code repository, so the user's chat edits begin where yours left off. It does not carry the preset's
        database or its compositions. It is not a preset itself, and changing or removing the preset afterwards
        never touches it.

        To start a composition (the content and design editor) instead, you do not need a copy: call
        `createComposition` with the preset's `widgetId` (from `listPartnerPresets`) and the managed user.

        The `Idempotency-Key` header is required (`400` without it). Send the same key when you retry, so one copy
        is made, not two. A copy that could not be made leaves nothing behind (503 `PRESET_COPY_FAILED`).

        The managed user must be yours and active.
      operationId: copyPresetForManagedUser
      parameters:
      - description: The managed user to give the copy to (Widgetic's id for the user)
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The key of the preset to copy
        explode: false
        in: path
        name: key
        required: true
        schema:
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          type: string
        style: simple
      - description: "Required: a call without it is refused with `400`. A key of\
          \ your own that names this one request; a UUID is ideal. It is 8 to 50 characters\
          \ of letters, digits, `-` and `_`. Send the same key again when you retry\
          \ (after a timeout, a dropped connection or a `5xx`) and the call is carried\
          \ out once: the retry gets the first answer back, marked `X-Idempotency-Cached:\
          \ true`. The same key with a different body is refused with `422`, and a\
          \ retry that arrives while the first call is still running with `409` (see\
          \ `Retry-After`)."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
          maxLength: 50
          minLength: 8
          pattern: "^[a-zA-Z0-9_-]{8,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyPartnerPresetRequest'
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPresetCopyResponse'
          description: The copy was made
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The key or the name is malformed, or the Idempotency-Key header\
            \ is missing"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - the caller is not a partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "No such managed user on your account (`MANAGED_USER_NOT_FOUND`),\
            \ or no preset with this key (`PRESET_NOT_FOUND`)"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The managed user is switched off, so nothing new can be made\
            \ for it (`MANAGED_USER_INACTIVE`)"
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The copy could not be made right now (`PRESET_COPY_FAILED`).
            Nothing was created; ask again.
      security:
      - apiKeyAuth: []
      summary: Give a managed user a copy of one of your presets
      tags:
      - Partner
