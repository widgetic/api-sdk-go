              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The list belongs to another account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The list has no entry with this id
        "409":
          content:
            application/json:
