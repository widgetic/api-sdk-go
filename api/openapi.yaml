            application/json:
              example:
                success: true
                data:
                  deleted: true
              schema:
                $ref: '#/components/schemas/uploadsIdDelete_200_response'
          description: The upload was deleted or was already deleted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such upload on this account (`UPLOAD_NOT_FOUND`)
      security:
      - apiKeyAuth: []
      summary: Delete an upload
      tags:
      - Partner
      - Uploads
      x-access-level: user
      x-visibility: public
    get:
      description: The details of one of the account's uploads. An upload that belongs
        to another account is not found.
      operationId: uploadsIdGet
      parameters:
      - description: The upload to read
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
          description: The upload
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such upload on this account (`UPLOAD_NOT_FOUND`)
      security:
      - apiKeyAuth: []
      summary: Get an upload by id
      tags:
      - Partner
      - Uploads
      x-access-level: user
      x-visibility: public
  /tokens/validate:
    get:
      operationId: validateToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validateToken_200_response'
          description: Token validation successful
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or expired token
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Validate current authentication token
      tags:
      - Partner
      - Tokens
      x-access-level: user
      x-visibility: public
  /partners/mine:
    get:
      description: |
        Returns the partner (nearly always one) that the signed-in account administers, with the id every other
        partner route asks for and the standing it is in: `active`, `inactive` (not activated yet), `suspended`
        (paused, with the reason Widgetic gave) or `payment_arrears` (a contract invoice is past its due date and
        unpaid, since `overdueSince`; the partner is stopped until it is paid). A partner API key is that account's
        key, so it reads its own partner here.

        An account that administers no partner is not refused: it gets `standing: not_a_partner` and an empty
        list, so a dashboard can tell "this is not a partner account" from "something failed".

        The call stays open while the partner is paused, not yet active or in payment arrears: that is when its
        dashboard has to say why.
      operationId: getMyPartners
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPartnersResponse'
          description: "The partners the account administers, and the account's standing"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key or session is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key does not carry the `partner:read` scope
      security:
      - apiKeyAuth: []
      summary: Find the partner you administer
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
  /partners/{partnerId}/credits/balance:
    get:
      description: |
        Returns the credits the partner has, and how much of that is reserved by operations that are still running.
        A partner has ONE account for its credits: the account of the person who administers it, the same account
        its API key acts as. There is nothing else to create or to fund. What its customers' editor sessions and its
        own API calls spend comes out of that account, and the credits a paid invoice carries are added to it, so
        this is the same balance `getUserCreditBalance` reads for that person.

        A partner with no administrator has no account to hold credits, and reads a balance of 0.

        Access: the person who administers the partner, or a Widgetic administrator.
      operationId: getPartnerCreditBalance
