      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { randomUUID } from 'node:crypto';
          import { Configuration, ManagedUsersApi } from '@widgetic/api-sdk';

          const managedUsersApi = new ManagedUsersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          // Give one of your users their own copy of the preset you registered as "rating":
          const copy = await managedUsersApi.copyPresetForManagedUser(
