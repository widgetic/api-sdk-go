      - explode: true
        in: query
        name: table
        required: false
        schema:
          maxLength: 63
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: |
          `desc` (the default) lists the newest entry first, `asc` the oldest. Entries are sorted by their time, then
          by their id (compared as text, byte by byte) in the same direction, so the order of two entries made at the
          same instant is always the same; an entry with no time counts as the oldest. A table with no time column is
          sorted by its id. The managed-user feed sorts by time, then by composition id, table and id.
        explode: true
        in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: |
          Only entries made at this time or later: `since` is INCLUSIVE (an entry made at exactly `since` is
          returned). A date and time with an offset, such as `2026-10-01T00:00:00Z`; anything else answers 400
          `INVALID_SINCE`. An entry with no time never matches, and a table with no time column answers 400
          `ENTRY_TABLE_HAS_NO_TIME`.
        explode: true
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: |
          Only entries made before this time: `until` is EXCLUSIVE (an entry made at exactly `until` is NOT
          returned), so `since=A&until=B` followed by `since=B&until=C` counts every entry once. Same form and same
          refusals as `since` (400 `INVALID_UNTIL`).
        explode: true
        in: query
        name: until
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: "Host context filters as `context[key]=value` (max 5 keys, counting\
          \ dotted `context.key` too). Use `column.<name>=value` for columns whose\
          \ names collide with reserved parameters."
        explode: true
        in: query
        name: context
        required: false
        schema:
          additionalProperties:
            type: string
          type: object
        style: deepObject
      - description: "Column filters as `filter[columnName]=value` (same meaning as\
          \ bare `columnName=value` or `column.columnName=value`; max 10 column filters\
          \ counting all spellings). A plain `filter=value` still filters a column\
          \ named `filter`."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          additionalProperties:
            type: string
          type: object
        style: deepObject
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                - compositionId: 11111111-1111-4111-8111-111111111111
                  table: ratings
                  id: "1"
                  createdAt: 2026-10-01T00:00:00.000000Z
                  values: {}
                  context: null
                meta:
                  nextCursor: null
                  total: 120
                  compositionsConsidered: 2
                  moreCompositions: false
                  partial: true
              schema:
                $ref: '#/components/schemas/ManagedUserEntriesPageSuccess'
          description: A page of entries across compositions
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid cursor or filters
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing partner scope or managed user access
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Managed user not found
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded
      security:
      - apiKeyAuth: []
      summary: List entries across a managed user's compositions
      tags:
      - Partner
      x-access-level: user
      x-visibility: public
