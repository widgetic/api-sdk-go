        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account id is not a valid id
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The keys belong to another account
      security:
      - apiKeyAuth: []
      summary: List the API keys of an account
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
    post:
      description: |-
        Makes a new API key for an account and returns its secret in `key`. That is the only time the secret is shown: Widgetic keeps a hash, so a key that was not stored cannot be recovered, only replaced. To rotate a key, make the new one, switch the integration over to it, then delete the old one.
        Only a person signed in on widgetic.com can make a key: a request made with an API key, or with an SDK token, is refused with 403. That way a leaked key cannot be used to make a second one that survives its revocation. Make keys from the dashboard; a key can still list, rename, switch off and delete keys.
        An `Idempotency-Key` header is required (8 to 50 characters: letters, digits, `-` and `_`). A retry with the same header and the same body returns the same answer instead of making a second key, and the same header with a different body is refused with 422. Make keys one at a time: two requests for the same account that run at the same moment can overwrite each other.
        A key can be limited to what it needs. Send a `preset` (`read_only`, `content` or `full_access`) or a list of `scopes`, never both. Send neither for a key that can do everything its owner can, as every key made before scopes existed. A limited key is refused with 403 and the code `API_KEY_SCOPE_MISSING` on anything outside its scopes, so a key held by a build server or by a partner's backend can be given only the part of the API it uses. The scopes of a key are fixed when it is made: to widen one, make a new key and delete the old one. A limited key cannot make, change or delete keys, exchange tokens or reach the administration routes. The list of scopes is in the `ApiKeyScope` schema.
        Accounts with API access (Solo, Teams and partner accounts) have no limit on how many keys they hold. An account on a plan without API access cannot make one (a partner account is not asked about a plan).
      operationId: createUserApiKey
      parameters:
      - description: "The account the key is for. For your own, your own user id"
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Required: a call without it is refused with `400`. A key of\
          \ your own that names this one request; a UUID is ideal. It is 8 to 50 characters\
          \ of letters, digits, `-` and `_`. Send the same key again when you retry\
          \ (after a timeout, a dropped connection or a `5xx`) and the call is carried\
          \ out once: the retry gets the first answer back, marked `X-Idempotency-Cached:\
          \ true`. The same key with a different body is refused with `422`, and a\
          \ retry that arrives while the first call is still running with `409` (see\
          \ `Retry-After`)."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
          maxLength: 50
          minLength: 8
          pattern: "^[a-zA-Z0-9_-]{8,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserApiKeyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUserApiKeyResponse'
          description: "The key was made. The secret is in `key`, and is not shown\
            \ again"
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The name, the expiry or the scopes are not valid (an unknown\
            \ scope, an empty list, or both a preset and scopes), or the Idempotency-Key\
            \ header is missing or malformed"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The request was made with an API key or an SDK token (only\
            \ a person signed in on widgetic.com can make a key), the account belongs\
            \ to someone else, or its plan does not include API keys"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Another request with this Idempotency-Key is still running
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: This Idempotency-Key was already used with a different body
      security:
      - apiKeyAuth: []
      summary: Create an API key
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
  /users/{id}/keys/{keyId}:
    delete:
      description: "Deletes a key and the record of what it was used for. The key\
        \ stops working at once on the server that took the request and within a minute\
        \ on the others, and cannot be brought back: make a new one instead. To stop\
        \ a key without losing it, switch it off with `updateUserApiKey`."
      operationId: deleteUserApiKey
      parameters:
      - description: The account the key belongs to
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The `keyId` of the key, as the list shows it"
        explode: false
        in: path
        name: keyId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserApiKeyResponse'
          description: The key was deleted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key belongs to another account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account has no key with this keyId (it may already have
            been deleted)
      security:
      - apiKeyAuth: []
      summary: Delete an API key
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
    put:
      description: |-
        Renames a key, or switches it off (`isActive: false`) or back on. A key that is switched off is refused at once by the server that took the request and within a minute by the others, and can be switched on again; deleting is for a key that is not coming back. The secret, the expiry and the scopes of a key cannot be changed. Only a key with full access can make these requests: a key limited to some scopes is refused with 403 and the code `API_KEY_SCOPE_MISSING`.
        Renaming and switching off can be done with an API key. Switching a key on needs a person signed in on widgetic.com: a request that asks for it with an API key or an SDK token is refused with 403, so a leaked key cannot bring a dormant key back to life.
      operationId: updateUserApiKey
      parameters:
      - description: The account the key belongs to
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The `keyId` of the key, as the list shows it"
        explode: false
        in: path
        name: keyId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserApiKeyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiKeyResponse'
          description: The key after the change
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Neither a name nor isActive was sent, or one of them is not\
            \ valid"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The key belongs to another account, or the request switches\
            \ a key on and was made with an API key or an SDK token (only a person\
            \ signed in on widgetic.com can)"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account has no key with this keyId
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Another key of the account already has this name
      security:
      - apiKeyAuth: []
      summary: "Rename an API key, or switch it off or on"
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
  /users/{id}/api-keys/{keyId}/logs:
    get:
      description: "Lists the calls made with one key, newest first: when, which path\
        \ and method, and the status each ended with. Use it to see whether a key\
        \ is still in use before deleting it, or to see what a key that should not\
        \ be in use has been doing."
      operationId: getUserApiKeyUsageLogs
      parameters:
