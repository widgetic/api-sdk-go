        item:
          additionalProperties: true
          description: "The item as stored, with the `id` the list gave it."
          type: object
      type: object
    CompositionEntryColumn:
      example:
        name: stars
        type: integer
      properties:
        name:
          description: The column's name exactly as the database spells it. Pass it
