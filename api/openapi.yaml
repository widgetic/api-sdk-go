        in: path
        name: credentialKey
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/removeUserAdapterConnection_200_response'
          description: The key is not connected any more
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A path value is malformed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The caller does not administer this partner, or the API key\
            \ has not full access"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many changes in a short time. Try again after the Retry-After
            seconds.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Adapter keys cannot be changed on this server right now (ADAPTER_CONNECTIONS_UNAVAILABLE).
            Nothing was changed
      security:
      - apiKeyAuth: []
      summary: Remove an adapter key from a partner
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, PartnersApi } from '@widgetic/api-sdk';

          const partnersApi = new PartnersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          const { removed } = await partnersApi.removePartnerAdapterConnection({
            partnerId,
            adapterId: 'email',
            credentialKey: 'resendApiKey',
          });
    put:
      description: |
        Gives an adapter the key it needs to act through a service the partner has an account with, for the widgets of
        the customers the partner manages. Take the `adapterId` and `credentialKey` from
        `getPartnerAdapterConnections`. Saving a key that is already connected replaces it.

        **What Widgetic does with it.** The key is stored encrypted, bound to this partner, this adapter and this
        credential, so that a stored value cannot be moved to another. It is never returned, never logged and never
        shown to a visitor of a widget or to your customers. A server of Widgetic opens it for the one call a widget
        makes through the adapter, uses it to call the provider on the partner's behalf, and discards it. To cut that
        off, remove the key here, or revoke it with the provider.

        **What is checked.** That the adapter exists and takes this credential, that a partner may keep it (some are
        for an owner only) and that the text is one line of at most 2048 characters. Whether the provider accepts the
        key is not checked here: it shows the first time a widget uses it.

        A widget whose adapter has no key connected is not charged and does not run that adapter: its visitors are told
        the feature is unavailable, and the partner is told once a day what to connect.

        This needs an API key with full access. The caller must be the person who administers the partner, or a
        Widgetic administrator. A retry is harmless: saving the same key twice only refreshes when it was set.
      operationId: setPartnerAdapterConnection
      parameters:
      - description: The partner that keeps the key
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The adapter the key is for
        explode: false
        in: path
        name: adapterId
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      - description: The key's name within the adapter
        explode: false
        in: path
        name: credentialKey
        required: true
        schema:
          maxLength: 40
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdapterConnectionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/setUserAdapterConnection_200_response'
          description: The key was saved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A path value or the body is malformed. The body takes exactly\
            \ one field, `credential`"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The caller does not administer this partner, or the API key\
            \ has not full access"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "There is no such adapter, the adapter has no such credential,\
            \ a partner may not keep it, or the partner does not exist (ADAPTER_NOT_FOUND,\
            \ CREDENTIAL_NOT_FOUND, CREDENTIAL_NOT_FOR_THIS_ACCOUNT, HOLDER_NOT_FOUND)"
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credential is not one line of text of at most 2048 characters
            (CREDENTIAL_VALUE_INVALID). Nothing was saved
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many changes in a short time. Try again after the Retry-After
            seconds.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Adapter keys cannot be saved on this server right now (ADAPTER_CONNECTIONS_UNAVAILABLE).
            Nothing was changed
      security:
      - apiKeyAuth: []
      summary: Connect an adapter key to a partner
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, PartnersApi } from '@widgetic/api-sdk';

          const partnersApi = new PartnersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          const connection = await partnersApi.setPartnerAdapterConnection({
            partnerId,
            adapterId: 'email',
            credentialKey: 'resendApiKey',
            setAdapterConnectionRequest: { credential: 'YOUR_PROVIDER_KEY' },
          });
          console.log(connection.connected, connection.updatedAt);
components:
  parameters:
    CompositionEntryLimit:
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 25
        maximum: 100
        minimum: 1
        type: integer
      style: form
    CompositionEntryOrder:
      description: |
        `desc` (the default) lists the newest entry first, `asc` the oldest. Entries are sorted by their time, then
        by their id (compared as text, byte by byte) in the same direction, so the order of two entries made at the
        same instant is always the same; an entry with no time counts as the oldest. A table with no time column is
        sorted by its id. The managed-user feed sorts by time, then by composition id, table and id.
      explode: true
      in: query
      name: order
      required: false
      schema:
        default: desc
        enum:
        - asc
        - desc
        type: string
      style: form
    CompositionEntrySince:
      description: |
        Only entries made at this time or later: `since` is INCLUSIVE (an entry made at exactly `since` is
        returned). A date and time with an offset, such as `2026-10-01T00:00:00Z`; anything else answers 400
        `INVALID_SINCE`. An entry with no time never matches, and a table with no time column answers 400
        `ENTRY_TABLE_HAS_NO_TIME`.
      explode: true
      in: query
      name: since
      required: false
      schema:
        format: date-time
        type: string
      style: form
    CompositionEntryUntil:
      description: |
        Only entries made before this time: `until` is EXCLUSIVE (an entry made at exactly `until` is NOT
        returned), so `since=A&until=B` followed by `since=B&until=C` counts every entry once. Same form and same
        refusals as `since` (400 `INVALID_UNTIL`).
      explode: true
      in: query
      name: until
      required: false
      schema:
        format: date-time
        type: string
      style: form
    CompositionEntryCursor:
      explode: true
      in: query
      name: cursor
      required: false
      schema:
        type: string
      style: form
    CompositionEntryContextFilters:
      description: "Host context filters as `context[key]=value` (max 5 keys, counting\
        \ dotted `context.key` too). Use `column.<name>=value` for columns whose names\
        \ collide with reserved parameters."
      explode: true
      in: query
      name: context
      required: false
      schema:
        additionalProperties:
          type: string
        type: object
      style: deepObject
    CompositionEntryColumnFilters:
      description: "Column filters as `filter[columnName]=value` (same meaning as\
        \ bare `columnName=value` or `column.columnName=value`; max 10 column filters\
        \ counting all spellings). A plain `filter=value` still filters a column named\
        \ `filter`."
      explode: true
      in: query
      name: filter
      required: false
      schema:
        additionalProperties:
          type: string
        type: object
      style: deepObject
    IdempotencyKeyRequired:
      description: "Required: a call without it is refused with `400`. A key of your\
        \ own that names this one request; a UUID is ideal. It is 8 to 50 characters\
        \ of letters, digits, `-` and `_`. Send the same key again when you retry\
        \ (after a timeout, a dropped connection or a `5xx`) and the call is carried\
        \ out once: the retry gets the first answer back, marked `X-Idempotency-Cached:\
        \ true`. The same key with a different body is refused with `422`, and a retry\
        \ that arrives while the first call is still running with `409` (see `Retry-After`)."
      explode: false
      in: header
      name: Idempotency-Key
      required: true
      schema:
        example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
        maxLength: 50
        minLength: 8
        pattern: "^[a-zA-Z0-9_-]{8,50}$"
        type: string
      style: simple
    IdempotencyKeyOptional:
      description: "Optional: without it the call is carried out every time it is\
        \ sent. A key of your own that names this one request; a UUID is ideal. It\
        \ is 8 to 50 characters of letters, digits, `-` and `_`. Send the same key\
        \ again when you retry (after a timeout, a dropped connection or a `5xx`)\
        \ and the call is carried out once: the retry gets the first answer back,\
        \ marked `X-Idempotency-Cached: true`. The same key with a different body\
        \ is refused with `422`, and a retry that arrives while the first call is\
        \ still running with `409` (see `Retry-After`)."
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
        maxLength: 50
        minLength: 8
        pattern: "^[a-zA-Z0-9_-]{8,50}$"
        type: string
      style: simple
    ManagedUserScopeId:
      description: "The id Widgetic gave the managed user (`POST /managed-users`).\
        \ Makes this call for one of your managed users, so that a mistake in your\
        \ own code cannot reach another customer's work. Send this header, or the\
        \ other one, never both. Left out, the call works on your whole account, as\
        \ it always has. With it, the call reaches only that user's compositions:\
        \ a list shows only theirs, a composition the call makes is filed under them,\
        \ and a composition of another user, or one that does not exist, answers `404`\
        \ (the same answer, so the call cannot be used to find out what another customer\
        \ has). A managed user that is not yours answers `404` with `MANAGED_USER_NOT_FOUND`.\
        \ An empty, repeated or malformed header is `400` with `MANAGED_USER_SCOPE_INVALID`;\
        \ an empty header is never read as no header. A call that is about the whole\
        \ account, such as the list of your managed users, is refused with `403` and\
        \ `MANAGED_USER_SCOPE_ROUTE_NOT_AVAILABLE`: send it without the header. Only\
        \ your API key can send it. The header is a limit the call asks for: whoever\
        \ holds the key can leave it out, so for a credential that a customer's browser\
        \ holds, use an editor session. An `Idempotency-Key` is kept apart for each\
        \ managed user."
      explode: false
      in: header
      name: X-Managed-User-Id
      required: false
      schema:
        example: 3f2b8c1e-7a4d-4e0b-9c55-2d1a6b7e8f90
        format: uuid
        type: string
      style: simple
    ManagedUserScopeExternalId:
      description: "Your own id for the managed user (its `externalId`), when you\
        \ do not keep Widgetic's. Makes this call for one of your managed users, so\
        \ that a mistake in your own code cannot reach another customer's work. Send\
        \ this header, or the other one, never both. Left out, the call works on your\
        \ whole account, as it always has. With it, the call reaches only that user's\
        \ compositions: a list shows only theirs, a composition the call makes is\
        \ filed under them, and a composition of another user, or one that does not\
        \ exist, answers `404` (the same answer, so the call cannot be used to find\
        \ out what another customer has). A managed user that is not yours answers\
        \ `404` with `MANAGED_USER_NOT_FOUND`. An empty, repeated or malformed header\
        \ is `400` with `MANAGED_USER_SCOPE_INVALID`; an empty header is never read\
        \ as no header. A call that is about the whole account, such as the list of\
        \ your managed users, is refused with `403` and `MANAGED_USER_SCOPE_ROUTE_NOT_AVAILABLE`:\
        \ send it without the header. Only your API key can send it. The header is\
        \ a limit the call asks for: whoever holds the key can leave it out, so for\
        \ a credential that a customer's browser holds, use an editor session. An\
        \ `Idempotency-Key` is kept apart for each managed user."
      explode: false
      in: header
      name: X-Managed-User-External-Id
      required: false
      schema:
        example: customer-1042
        maxLength: 255
        minLength: 1
        type: string
      style: simple
  schemas:
    PublicEmbedFailure:
      description: "What a public embed route answers when it refuses or fails. It\
        \ is the standard error answer of the API (`success`, `message`, `error`),\
        \ and the short `code` (with `details` and `correlationId` when the route\
        \ has them) is also at the top level, because a page that embeds a composition\
        \ branches on it there. `error.code` is the same word in the codes of the\
        \ rest of the API where those have it: `NOT_FOUND` is `RESOURCE_NOT_FOUND`,\
        \ `RATE_LIMITED` is `RATE_LIMIT_EXCEEDED`, and the others (`DOMAIN_NOT_ALLOWED`,\
        \ `UNPUBLISHED`, `SUSPENDED`, the codes of the entry route) are the same in\
        \ both places."
      example:
        success: true
        message: Example message
        code: NOT_FOUND
        details: {}
        correlationId: Example correlationId
        error: {}
      properties:
        success:
          type: boolean
        message:
          description: "What happened, for a person."
          type: string
        code:
          description: "The short code a page branches on: `DOMAIN_NOT_ALLOWED`, `UNPUBLISHED`,\
            \ `SUSPENDED`, `NOT_FOUND`, `RATE_LIMITED`, and for the entry route the\
            \ codes listed with its answers."
          example: NOT_FOUND
          type: string
        details:
          $ref: '#/components/schemas/PublicEmbedFailure_details'
        correlationId:
          description: "The id of the request, for the routes that carry it."
          type: string
        error:
          $ref: '#/components/schemas/PublicEmbedFailure_error'
      required:
      - code
      - error
      - message
      - success
      type: object
    PublicAdapterCallRequest:
      additionalProperties: false
      example:
        requestId: Example requestId
        version: 42
        input: {}
        context: {}
        captchaToken: Example captchaToken
      properties:
        requestId:
          description: "Names this attempt: 8 to 64 characters, letters, digits, `_`\
            \ and `-`, the first a letter or a digit (a UUID fits). A module makes\
            \ a new one for each action of the visitor. An operation that costs credits\
            \ is charged once for each `requestId`, so a repeat of one that was charged\
            \ and not given back is refused (409 `REQUEST_ALREADY_USED`) and does\
            \ no work."
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$"
          type: string
        version:
          description: "The version of the adapter the widget's code was built against\
            \ (the `vN` of its import). When it is left out, the newest version the\
            \ widget's live manifest lists."
          maximum: 1000
          minimum: 1
          type: integer
        input:
          additionalProperties: true
          description: "What the operation is asked to do. Each operation says what\
            \ it accepts and answers 400, 413 or 422 with a code of its own for what\
            \ it cannot use. Defaults to an empty object."
          type: object
        context:
          additionalProperties: true
          description: "The host context the embedding page gave the widget, as the\
            \ entry route takes it (see the description of `createPublicCompositionEntry`,\
            \ with its **Signed context**). It is not authenticated unless the partner\
            \ signs it. At most 4096 bytes of JSON, the two signature keys included."
          nullable: true
          type: object
        captchaToken:
          description: "The visitor's CAPTCHA token, for an operation that asks for\
            \ one (the answer `CAPTCHA_REQUIRED` says so)."
          maxLength: 4096
          nullable: true
          type: string
      required:
      - requestId
      type: object
    PublicAdapterCallResult:
      example:
        success: true
        data: {}
      properties:
        success:
          example: true
          type: boolean
        data:
          $ref: '#/components/schemas/PublicAdapterCallResult_data'
      required:
      - data
      - success
      type: object
    PublicAdapterCallError:
      example:
        success: false
        error: Example error
        code: Example code
        correlationId: Example correlationId
      properties:
        success:
          example: false
          type: boolean
        error:
          description: "A sentence a visitor may read. It never says why a feature\
            \ is unavailable: not that its owner is out of credits, not what a balance\
            \ is, not which limit was reached beyond the word `RATE_LIMITED` or `WIDGET_LIMIT_REACHED`.\
            \ (On a 429 the standard rate-limit envelope is sent instead: `error`\
            \ is then an object, and `code` beside it is the flat code.)"
          type: string
        code:
          description: "What a module switches on. The codes of the gateway itself\
            \ are `ADAPTER_BODY_INVALID`, `CAPTCHA_REQUIRED`, `ADAPTER_NOT_AVAILABLE`,\
            \ `REQUEST_ALREADY_USED`, `RATE_LIMITED`, `WIDGET_LIMIT_REACHED`, `ADAPTER_FAILED`,\
            \ `ADAPTER_UNAVAILABLE` and `ADAPTER_TIMEOUT`, with `ORIGIN_NOT_ALLOWED`,\
            \ `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `CONTEXT_SIGNATURE_REQUIRED`,\
            \ `CONTEXT_SIGNATURE_INVALID`, `CONTEXT_SIGNATURE_EXPIRED`, `CONTEXT_SIGNATURE_UNAVAILABLE`\
            \ and the codes of the serving gate (`NOT_FOUND`, `UNPUBLISHED`, `SUSPENDED`)\
            \ it shares with the other public embed routes. An operation may add codes\
            \ of its own (capital letters and `_`) for an input it refused."
          type: string
        correlationId:
          description: Quote it when asking for help with a call.
          type: string
      required:
      - code
      - error
      - success
      type: object
    PublicAdapterFileBytes:
      description: "The bytes of the file as they are: no encoding and no form around\
        \ them."
      format: binary
      type: string
    PublicAdapterFileResult:
      example:
        success: true
        data: {}
      properties:
        success:
          example: true
          type: boolean
        data:
          $ref: '#/components/schemas/PublicAdapterFileResult_data'
      required:
      - data
      - success
      type: object
    PersonalWorkspaceDomain:
      description: One website on a person's own list of the websites allowed to show
        their widgets
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        domain: example.com
        createdAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          description: The id of the entry. Use it to change or remove the entry
          format: uuid
          type: string
        userId:
          description: The account the list belongs to
          format: uuid
          type: string
        domain:
          description: "The website as it is kept: lower case, with no scheme, port,\
            \ path or leading `www.`. A leading `*.` means the website and all of\
            \ its subdomains"
          example: example.com
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - domain
      - id
      - userId
      type: object
    PersonalWorkspaceDomainResult:
      example:
        message: Domain added successfully
        domain: null
      properties:
        message:
          example: Domain added successfully
          type: string
        domain:
          $ref: '#/components/schemas/PersonalWorkspaceDomain'
      required:
      - domain
      - message
      type: object
    ApiKeyScope:
      description: |-
        One thing an API key may be allowed to do. A key made with a list of scopes does only what the list
        names; a key made without one has full access, and does everything its owner can.

        - `content:read` reads widgets, compositions, canvases, projects, folders, uploads, translations and the
          analytics of your content.
        - `content:write` creates, changes, publishes and deletes the same. It includes `content:read`.
        - `generate` runs the AI that builds widgets and compositions, and follows or cancels what it is doing.
          This spends credits.
        - `partner:read` reads managed users, what they spent, presets, the contract and the storage destination.
        - `partner:write` creates, changes and deletes managed users and presets. It includes `partner:read`.
        - `billing:read` reads credits, usage, invoices, subscriptions and payment methods.
        - `billing:write` buys credits, pays invoices and changes a subscription or a payment method. It
          includes `billing:read`.
        - `account:read` reads the profile, organizations and members, allowed domains, notices and the names
          of API keys.
        - `account:write` changes the profile, organizations and members, allowed domains and integrations. It
          includes `account:read`.

        Starting an editor session for a managed user needs `partner:write`, `content:write` and `generate`
        together. Making, changing and deleting keys, exchanging tokens, signing in and the administration
        routes need full access: a limited key cannot make itself a bigger one.

        A request outside the scopes of the key is refused with 403 and the code `API_KEY_SCOPE_MISSING`.
        `error.details.missingScopes` names what a new key needs, and `error.details.fullAccessRequired` is true
        when no list of scopes would have been enough. The scopes of a key cannot be changed once it is made.
      enum:
      - content:read
      - content:write
      - generate
      - partner:read
      - partner:write
      - billing:read
      - billing:write
      - account:read
      - account:write
      type: string
    UserApiKey:
      description: "An API key of an account, as it is listed. It never carries the\
        \ secret: that is shown once, in the answer to the request that made the key,\
        \ and cannot be read again."
      example:
        keyId: 5f0c1e2a-7a41-4c5e-9f3b-0c2a8b1d6e44
        keyPreview: wgt_prt_ab12...
        name: Production
        createdAt: 2026-01-15T09:30:00.000Z
        expiresAt: 2026-01-15T09:30:00.000Z
        lastUsedAt: 2026-01-15T09:30:00.000Z
        isActive: true
        scopes:
        - Example ApiKeyScope
        preset: Example preset
      properties:
        keyId:
          description: "The id of the key. Use it to rename, switch off, delete or\
            \ read the usage of the key"
          example: 5f0c1e2a-7a41-4c5e-9f3b-0c2a8b1d6e44
          type: string
        keyPreview:
          description: "The first characters of the key, to tell keys apart. Not enough\
            \ to use it"
          example: wgt_prt_ab12...
          type: string
        name:
          description: The name given to the key
          example: Production
          type: string
        createdAt:
          format: date-time
          type: string
        expiresAt:
          description: When the key stops working. Absent or null when it does not
            expire
          format: date-time
          nullable: true
          type: string
        lastUsedAt:
          description: When the key was last used. Absent or null when it never was
          format: date-time
          nullable: true
          type: string
        isActive:
          description: Whether the key works. A key that is switched off is refused
            until it is switched on again
          type: boolean
        scopes:
          description: What the key may do. A key with full access holds every scope.
            The scopes of a key are fixed when it is made
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
        preset:
          description: "The name the scopes amount to. `full_access` is a key that\
            \ is not limited, `read_only` and `content` are the ready-made lists,\
            \ and `custom` is any other list"
          enum:
          - read_only
          - content
          - full_access
          - custom
          type: string
      required:
      - createdAt
      - isActive
      - keyId
      - keyPreview
      - name
      - preset
      - scopes
      type: object
    CreatedUserApiKey:
      description: "A key that has just been made. It is the only answer that ever\
        \ carries the secret, in `key`. Store it now: Widgetic keeps only a hash of\
        \ it, and it cannot be shown again."
      example:
        key: wgt_prt_YOUR_NEW_KEY
        keyId: 5f0c1e2a-7a41-4c5e-9f3b-0c2a8b1d6e44
        keyPreview: wgt_prt_ab12...
        name: Production
        createdAt: 2026-01-15T09:30:00.000Z
        expiresAt: 2026-01-15T09:30:00.000Z
        isActive: true
        scopes:
        - Example ApiKeyScope
        preset: Example preset
      properties:
        key:
          description: "The secret. Send it as a bearer token, in the `Authorization`\
            \ header. Shown once"
          example: wgt_prt_YOUR_NEW_KEY
          type: string
        keyId:
          description: The id of the key
          example: 5f0c1e2a-7a41-4c5e-9f3b-0c2a8b1d6e44
          type: string
        keyPreview:
          example: wgt_prt_ab12...
          type: string
        name:
          example: Production
          type: string
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          nullable: true
          type: string
        isActive:
          type: boolean
        scopes:
          description: What the key may do. A key made without scopes holds every
            scope
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
        preset:
          description: The name the scopes amount to
          enum:
          - read_only
          - content
          - full_access
          - custom
          type: string
      required:
      - createdAt
      - isActive
      - key
      - keyId
      - keyPreview
      - name
      - preset
      - scopes
      type: object
    CreateUserApiKeyRequest:
      example:
        name: Production
        expiresAt: 2027-01-31T00:00:00Z
        preset: content
        scopes:
        - content:read
        - generate
      properties:
        name:
          description: "A name for the key, to tell it from the account's other keys"
          example: Production
          maxLength: 100
          minLength: 1
          type: string
        expiresAt:
          description: "When the key stops working, as a date and time in the future\
            \ with a zone. Omit it for a key that does not expire"
          example: 2027-01-31T00:00:00Z
          format: date-time
          type: string
        preset:
          description: "A ready-made list of scopes. `read_only` looks at everything\
            \ the account holds and changes nothing. `content` builds and manages\
            \ widgets and compositions and runs the AI, and touches no billing, no\
            \ people and no partners. `full_access` is the same as sending neither\
            \ `preset` nor `scopes`. Send either `preset` or `scopes`, not both"
          enum:
          - read_only
          - content
          - full_access
          example: content
          type: string
        scopes:
          description: "What the key may do, when a preset is not enough. Naming a\
            \ write scope includes its read scope, and a list that holds every scope\
            \ is a key with full access. Send either `scopes` or `preset`, not both"
          example:
          - content:read
          - generate
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          minItems: 1
          type: array
      required:
      - name
      type: object
    UpdateUserApiKeyRequest:
      description: At least one of the two is required
      example:
        name: Example name
        isActive: true
      properties:
        name:
          description: A new name. It cannot be one that another key of the account
            already has
          maxLength: 100
          minLength: 1
          type: string
        isActive:
          description: "false switches the key off, true switches it on again. A key\
            \ that is switched off stops working within a minute at the latest, and\
            \ at once on the server that took the request"
          type: boolean
      type: object
    UserApiKeyUsageLog:
      description: One call made with a key
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        keyId: Example keyId
        timestamp: 2026-01-15T09:30:00.000Z
        path: /v1/widgets
        method: GET
        status: 200
        kind: Example kind
        details: {}
      properties:
        id:
          format: uuid
          type: string
        keyId:
          description: The key the call was made with
          type: string
        timestamp:
          format: date-time
          type: string
        path:
          example: /v1/widgets
          type: string
        method:
          example: GET
          type: string
        status:
          description: The HTTP status the call ended with
          example: 200
          type: integer
        kind:
          nullable: true
          type: string
        details:
          additionalProperties: true
          description: What was recorded about the call
          type: object
      required:
      - id
      - keyId
      - method
      - path
      - status
      - timestamp
      type: object
    Upload:
      description: A file stored for the account that uploaded it.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        url: Example url
        mime_type: image/png
        file_name: Example file_name
        file_size: 42
        width: 42
        height: 42
        storage_key: Example storage_key
        context_type: Example context_type
        source: Example source
        widget_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        conversation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        managed_user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        purpose: Example purpose
      properties:
        id:
          format: uuid
          type: string
        url:
          description: The public address of the stored file
          format: uri
          type: string
        mime_type:
          description: The type of the stored file. A HEIC or HEIF photo is stored
            as `image/jpeg`.
          example: image/png
          type: string
        file_name:
          type: string
        file_size:
          description: "Size of the stored file, in bytes"
          type: integer
        width:
          description: "Width in pixels, for images"
          nullable: true
          type: integer
        height:
          description: "Height in pixels, for images"
          nullable: true
          type: integer
        storage_key:
          description: Where the file sits in its storage bucket
          type: string
        context_type:
          description: What the file was uploaded for. Media for widget content is
            `content-property`.
          enum:
          - widget-codegen
          - browser-ic
          - content-property
          type: string
        source:
          description: "Which part of the product, or which client, uploaded the file.\
            \ `widget-visitor-upload` is a file a visitor sent through a widget's\
            \ upload adapter; it cannot be asked for when uploading."
          enum:
          - chat-upload
          - chat-screenshot
          - browser-ic-screenshot
          - preview-screenshot
          - file-browser-upload
          - widget-visitor-upload
          type: string
        widget_id:
          format: uuid
          nullable: true
          type: string
        conversation_id:
          format: uuid
          nullable: true
          type: string
        managed_user_id:
          description: "The managed user the file was uploaded for, or null when it\
            \ is the account's own. List one managed user's files with the `managed_user_id`\
            \ or `managed_user_external_id` query parameter of `uploadsGet`."
          format: uuid
          nullable: true
          type: string
        purpose:
          description: "Where in the product the partner uses the file, or null when\
            \ unknown"
          enum:
          - canvas
          - chat
          - field
          nullable: true
          type: string
      required:
      - context_type
      - file_name
      - file_size
      - id
      - mime_type
      - source
      - storage_key
      - url
      type: object
    UploadLimits:
      description: What the upload endpoints accept. Read it rather than hard-coding
        the numbers.
      example:
        multipart_max_bytes: 42
        multipart_mime_types: []
        tus_enabled: true
        tus_max_bytes: 42
        tus_chunk_size_bytes: 42
        tus_mime_types: []
      properties:
        multipart_max_bytes:
          description: "The largest file `uploadsPost` takes in one request, in bytes.\
            \ The same for every account."
          type: integer
        multipart_mime_types:
          description: The file types `uploadsPost` takes for media (`content-property`
            uploads)
          items:
            type: string
          type: array
        tus_enabled:
          description: Whether resumable uploads are switched on. They need a signed-in
            session; an API key uses `uploadsPost`.
          type: boolean
        tus_max_bytes:
          description: "The largest file a resumable upload takes, in bytes (250 MB\
            \ by default). The same for every account, whatever its plan. A file over\
            \ `multipart_max_bytes` goes through a resumable upload."
          type: integer
        tus_chunk_size_bytes:
          description: "The chunk size resumable uploads are tuned for, in bytes.\
            \ A client may send smaller or larger chunks."
          type: integer
        tus_mime_types:
          items:
            type: string
          type: array
      type: object
    MyPartner:
      description: |
        A partner as the person who administers it reads it: which partner it is, what standing it is in, and why it is paused when it is. The webhook address, its secret and the billing settings have their own routes and are not part of it.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name: Example name
        status: Example status
        contactEmail: Example contactEmail
        allowedDomains: []
        platformDomain: acme.com
        suspendedAt: 2026-01-15T09:30:00.000Z
        suspensionReason: Example suspensionReason
        createdAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          description: "The id every other partner route asks for (`/partners/{partnerId}/...`)"
          format: uuid
          type: string
        name:
          type: string
        status:
          description: |
            `active` while the partner is in force. `inactive` until Widgetic activates it (and after a deactivation). `suspended` while it is paused, which is done by hand and comes back when Widgetic resumes it.
          enum:
          - active
          - inactive
          - suspended
          type: string
        contactEmail:
          nullable: true
          type: string
        allowedDomains:
          description: |
            The domains Widgetic added to the embeds of this partner's customers. The domains the person added themselves are on the domains route of the account.
          items:
            type: string
          type: array
        platformDomain:
          description: |
            The website where the partner integrates Widgetic, as a bare name. It and every subdomain of it (`app.acme.com`, `learn.eu.acme.com`) can always show the partner's widgets, the ones its customers make through it included, and send entries to them, whatever `allowedDomains` and the account's own domain list say, so a list can never lock the partner's own website out. It is not an entry of `allowedDomains`, and it does not turn an empty list into a restriction: a partner that lists nothing stays unrestricted for every website. Widgetic sets it when the partner is set up; contact Widgetic to change it. `null` when none has been set.
          example: acme.com
          nullable: true
          type: string
        suspendedAt:
          description: When the partner was paused; null unless it is paused now
          format: date-time
          nullable: true
          type: string
        suspensionReason:
          description: "The reason given when the partner was paused, as the partner\
            \ is told it; null unless it is paused now"
          nullable: true
          type: string
        createdAt:
          format: date-time
          nullable: true
          type: string
      required:
      - allowedDomains
      - id
      - name
      - platformDomain
      - status
      - suspendedAt
      - suspensionReason
      type: object
    MyPartners:
      example:
        standing: Example standing
        overdueSince: 2026-01-15T09:30:00.000Z
        partners:
        - Example MyPartner
      properties:
        standing:
          description: |
            The standing of the account as a whole, the word every gate reads: `not_a_partner` when the account administers no partner; otherwise `active` when any of its partners is in force, else `payment_arrears` when the partners that are active each have a contract invoice that is past its due date and unpaid, else `suspended` when any is paused, else `inactive`. `payment_arrears` is not set by anybody: it stops the same things a pause stops (billing, invoices, credits and the other routes a partner needs to pay stay open) and ends by itself the moment the invoice is paid.
          enum:
          - not_a_partner
          - inactive
          - active
          - suspended
          - payment_arrears
          type: string
        overdueSince:
          description: |
            When the oldest overdue contract invoice was due; null unless `standing` is `payment_arrears`. Pay the invoices in the list of `GET /invoices/partner/{partnerId}` that are past their due date to end it.
          format: date-time
          nullable: true
          type: string
        partners:
          description: "The partners the account administers (nearly always one),\
            \ the oldest first"
          items:
            $ref: '#/components/schemas/MyPartner'
          type: array
      required:
      - overdueSince
      - partners
      - standing
      type: object
    RequestExtraCredits:
      example:
        usd: 250
      properties:
        usd:
          description: |
            The dollars to spend on credits, to the cent: at least 10, at most 100000 in one request. The invoice is for the most whole credits that money buys at the list price of a credit, so it is never for more than this (12.34 buys 123 credits and the invoice says 12.30).
          example: 250
          maximum: 100000
          minimum: 10
          type: number
      required:
      - usd
      type: object
    PartnerExtraCreditsInvoice:
      description: "The invoice for extra credits that was issued, and what paying\
        \ it adds."
      example:
        invoiceId: Example invoiceId
        number: Example number
        hostedInvoiceUrl: Example hostedInvoiceUrl
        pdfUrl: Example pdfUrl
        credits: 42
        creditPriceUsd: 42
        amountUsd: 42
        taxUsd: 42
        totalUsd: 42
        currency: Example currency
        dueDate: 2026-01-15T09:30:00.000Z
        dueDays: 42
      properties:
        invoiceId:
          description: Stripe's id for the invoice.
          type: string
        number:
          description: "The number printed on the invoice, once Stripe has numbered\
            \ it."
          nullable: true
          type: string
        hostedInvoiceUrl:
          description: The page where the invoice is viewed and paid.
          format: uri
          nullable: true
          type: string
        pdfUrl:
          description: A PDF of the invoice.
          format: uri
          nullable: true
          type: string
        credits:
          description: "The credits paying the invoice adds, once and for good. They\
            \ do not expire."
          type: integer
        creditPriceUsd:
          description: "What one credit costs, in dollars. It is the list price, not\
            \ the price of the contract."
          type: number
        amountUsd:
          description: "The price of those credits, in dollars, before tax. Never\
            \ more than `usd` of the request."
          type: number
        taxUsd:
          description: "The tax added to the invoice, in dollars (0 when there is\
            \ none)."
          type: number
        totalUsd:
          description: "What is paid, in dollars. The price plus the tax."
          type: number
        currency:
          description: "The currency of the invoice, in upper case (USD)."
          type: string
        dueDate:
          description: "When payment is due, as printed on the invoice."
          format: date-time
          nullable: true
          type: string
        dueDays:
          description: How many days there are to pay.
          type: integer
      required:
      - amountUsd
      - creditPriceUsd
      - credits
      - currency
      - dueDate
      - dueDays
      - hostedInvoiceUrl
      - invoiceId
      - number
      - pdfUrl
      - taxUsd
      - totalUsd
      type: object
    PartnerBillingOverview:
      description: "The partner's credits, contract terms and billing status in one\
        \ answer."
      example:
        partner: {}
        operationalCredits: {}
        partnerCustomization: null
        billingIntegration: {}
      properties:
        partner:
          $ref: '#/components/schemas/PartnerBillingOverview_partner'
        operationalCredits:
          $ref: '#/components/schemas/PartnerBillingOverview_operationalCredits'
        partnerCustomization:
          allOf:
          - $ref: '#/components/schemas/PartnerCustomization'
          description: The partner's contract; null while none has been recorded
          nullable: true
        billingIntegration:
          $ref: '#/components/schemas/PartnerBillingOverview_billingIntegration'
      required:
      - billingIntegration
      - operationalCredits
      - partner
      type: object
    PartnerContract:
      description: |
        The commercial terms agreed with a partner. Prices are in dollars. Internal negotiation notes and the staff members who edited the record are not part of it.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        customPrice: 42
        customCredits: 42
        creditPriceUsd: 42
        effectiveCreditPriceUsd: 42
        periodTotalUsd: 42
        additionalFeatures: []
        billingCycle: Example billingCycle
        minimumCommitmentMonths: 42
        supportSla: 99.9%
        contractStartDate: Example contractStartDate
        contractEndDate: Example contractEndDate
        isActiveContract: true
        createdAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          format: uuid
          type: string
        partnerId:
          format: uuid
          type: string
        customPrice:
          description: The agreed price per `billingCycle`; null when the standard
            price applies
          nullable: true
          type: number
        customCredits:
          description: Credits received each billing period (`billingCycle`); null
            when the standard allowance applies
          nullable: true
          type: integer
        creditPriceUsd:
          description: "The agreed price of one credit, in dollars; null when the\
            \ list price applies"
          nullable: true
          type: number
        effectiveCreditPriceUsd:
          description: "What one credit costs you, in dollars. The agreed price, or\
            \ the list price when none was agreed"
          type: number
        periodTotalUsd:
          description: "What one billing period costs, in dollars before tax, `customCredits`\
            \ times `effectiveCreditPriceUsd`. Null while no credits were agreed"
          nullable: true
          type: number
        additionalFeatures:
          description: Features included beyond the standard partner plan
          items:
            type: string
          type: array
        billingCycle:
          enum:
          - monthly
          - quarterly
          - annual
          type: string
        minimumCommitmentMonths:
          type: integer
        supportSla:
          example: 99.9%
          type: string
        contractStartDate:
          format: date
          nullable: true
          type: string
        contractEndDate:
          description: Null when the contract runs until it is ended
          format: date
          nullable: true
          type: string
        isActiveContract:
          description: "True while the contract is in force, that is when it is open-ended\
            \ or today falls between its start and end"
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    PartnerStorageDestination:
      description: |
        The bucket a partner keeps the files its account uploads in: a bucket on an S3-compatible service that the partner owns. The secret access key is never returned.
      example:
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        endpoint: https://abc123.r2.cloudflarestorage.com
        region: auto
        bucket: acme-widget-media
        keyPrefix: widgetic/
        publicBaseUrl: https://media.example.com
        forcePathStyle: true
        accessKeyHint: 4F2A
        verifiedAt: 2026-01-15T09:30:00.000Z
        lastVerificationError: Example lastVerificationError
        lastVerificationFailedAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        partnerId:
          format: uuid
          type: string
        endpoint:
          description: "The HTTPS address of the S3-compatible service, scheme and\
            \ host only"
          example: https://abc123.r2.cloudflarestorage.com
          type: string
        region:
          example: auto
          type: string
        bucket:
          example: acme-widget-media
          type: string
        keyPrefix:
          description: "The folder inside the bucket every file is written under.\
            \ Empty, or folders each followed by a slash."
          example: widgetic/
          type: string
        publicBaseUrl:
          description: "Where the stored files are served from. A file's url is this\
            \ address, a slash and the file's key."
          example: https://media.example.com
          type: string
        forcePathStyle:
          description: Whether the bucket name goes in the path of a request (true)
            or in the host name (false)
          type: boolean
        accessKeyHint:
          description: "The last four characters of the access key id, to tell which\
            \ key is set. Not enough to use it."
          example: 4F2A
          type: string
        verifiedAt:
          description: When the destination last passed the check
          format: date-time
          type: string
        lastVerificationError:
          description: Why the most recent re-check failed. Null while the last check
            passed.
          nullable: true
          type: string
        lastVerificationFailedAt:
          format: date-time
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - accessKeyHint
      - bucket
      - endpoint
      - forcePathStyle
      - keyPrefix
      - partnerId
      - publicBaseUrl
      - region
      - updatedAt
      - verifiedAt
      type: object
    SetPartnerStorageDestinationRequest:
      additionalProperties: false
      description: |
        The bucket to keep the partner's files in, and the key that may write to it. The field names are camelCase, like every answer of the API; the snake_case spelling (`keyPrefix`) is read too.
      example:
        endpoint: https://abc123.r2.cloudflarestorage.com
        region: auto
        bucket: acme-widget-media
        keyPrefix: widgetic/
        publicBaseUrl: https://media.example.com
        forcePathStyle: true
        accessKeyId: Example accessKeyId
        secretAccessKey: Example secretAccessKey
      properties:
        endpoint:
          description: |
            The HTTPS address of the S3-compatible service, scheme and host only (no path, port or credentials). It must be a host name, not an IP address, and must resolve to the public internet.
          example: https://abc123.r2.cloudflarestorage.com
          type: string
        region:
          description: The region the service signs requests for. Use auto where the
            service says so (such as Cloudflare R2).
          example: auto
          type: string
        bucket:
          example: acme-widget-media
          type: string
        keyPrefix:
          default: ""
          description: |
            A folder inside the bucket to write every file under, for example widgetic/uploads. Folders are made of letters, digits, dots, hyphens and underscores. Leave it out to write at the root of the bucket.
          example: widgetic/
          type: string
        publicBaseUrl:
          description: |
            Where the stored files are served from: the bucket's public address, or a CDN in front of it. The address of a file is this value, a slash and the file's key in the bucket, which starts with the key prefix. A path is allowed (https://media.example.com/files/acme-widget-media).
          example: https://media.example.com
          type: string
        forcePathStyle:
          default: true
          description: |
            Put the bucket name in the path of a request. Every S3-compatible service supports this; set it to false only for a service that needs the bucket name in the host name.
          type: boolean
        accessKeyId:
          description: The id of an access key that may put objects into the bucket
          type: string
        secretAccessKey:
          description: The secret of that access key. It is stored encrypted and is
            never returned.
          format: password
          type: string
          writeOnly: true
      required:
      - accessKeyId
      - bucket
      - endpoint
      - publicBaseUrl
      - region
      - secretAccessKey
      type: object
    PartnerStorageRemoval:
      example:
        removed: true
      properties:
        removed:
          description: False when the partner had no storage destination to remove
          type: boolean
      required:
      - removed
      type: object
    PartnerPreset:
      description: |
        A widget the partner offers its managed users as a starting point, under a key the partner's code names. It belongs to the partner's account, so every managed user of the partner sees the same list.
      example:
        key: rating
        widgetId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title: Star rating
        description: Example description
        position: 42
        widgetName: Example widgetName
        thumbnailUrl: Example thumbnailUrl
        createdAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        key:
          description: The name the partner's code uses for the preset
          example: rating
          type: string
        widgetId:
          description: The partner's widget. Use it to make a composition (`createComposition`
            with this `widgetId`).
          format: uuid
          type: string
        title:
          description: What the partner's picker shows. Null means show `widgetName`.
          example: Star rating
          nullable: true
          type: string
        description:
          nullable: true
          type: string
        position:
          description: "The list is ordered by this, smallest first, then by key"
          type: integer
        widgetName:
          description: The widget's own name
          type: string
        thumbnailUrl:
          description: "The widget's thumbnail, when it has one"
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - createdAt
      - description
      - key
