                $ref: '#/components/schemas/getPartnerCreditTransactions_200_response'
          description: "The account's ledger entries, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
