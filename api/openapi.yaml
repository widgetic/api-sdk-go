      - description: |
          Only entries of this type, for instance `debit` for the credits spent. The types are listed on `AccountCreditTransaction`.
        explode: true
        in: query
        name: transactionType
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Number of entries to skip
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
