  /compositions:
    get:
      description: |
        Retrieves all compositions with pagination support.

        Pass `managedUserId` (Widgetic's id for one of your managed users) or `managedUserExternalId` (your own
        identifier for the user) to list only the compositions made for that managed user. The compositions of
        your other managed users, and your own, are left out. It combines with the other filters and with paging.
        A managed user that is not yours, or does not exist, is answered with 404 and `MANAGED_USER_NOT_FOUND`.

        An editor session with the `creator` surface may call this to list the compositions of ONE widget it
        built: it must send `widgetId`, and the answer holds only the compositions made for the session's
        managed user.
      operationId: getAllCompositions
      parameters:
      - description: Page number for pagination
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: |
          The order of the list, as `<field>:<asc|desc>`. The field is `createdAt`, `updatedAt`, `name` or `status`
          (the snake_case spelling, such as `created_at`, is read too). `asc` or `desc` alone orders by `createdAt`.
          Default: `createdAt:desc`. Any other field is a 400.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          example: createdAt:desc
          type: string
        style: form
      - description: Filter compositions by widget ID
        explode: true
        in: query
        name: widgetId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter by workspace
        explode: true
        in: query
        name: workspace
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - description: Only the compositions in this project (the project's id).
        explode: true
        in: query
        name: projectFolder
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "Only the compositions in this status. Without it, every status\
          \ is listed."
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - draft
          - published
          - archived
          type: string
        style: form
      - description: "List only the compositions made for this managed user (Widgetic's\
          \ id for the user). Send this or `managedUserExternalId`, not both. Send\
          \ it as `managedUserId`; the snake_case spelling `managed_user_id` is refused\
          \ with a 400, not ignored."
        explode: true
        in: query
        name: managedUserId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "List only the compositions made for the managed user you registered\
          \ with this `externalId` (your own identifier for the user). Send this or\
          \ `managedUserId`, not both."
        explode: true
        in: query
        name: managedUserExternalId
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      - description: "The id Widgetic gave the managed user (`POST /managed-users`).\
          \ Makes this call for one of your managed users, so that a mistake in your\
          \ own code cannot reach another customer's work. Send this header, or the\
          \ other one, never both. Left out, the call works on your whole account,\
          \ as it always has. With it, the call reaches only that user's compositions:\
          \ a list shows only theirs, a composition the call makes is filed under\
          \ them, and a composition of another user, or one that does not exist, answers\
          \ `404` (the same answer, so the call cannot be used to find out what another\
          \ customer has). A managed user that is not yours answers `404` with `MANAGED_USER_NOT_FOUND`.\
          \ An empty, repeated or malformed header is `400` with `MANAGED_USER_SCOPE_INVALID`;\
          \ an empty header is never read as no header. A call that is about the whole\
          \ account, such as the list of your managed users, is refused with `403`\
          \ and `MANAGED_USER_SCOPE_ROUTE_NOT_AVAILABLE`: send it without the header.\
          \ Only your API key can send it. The header is a limit the call asks for:\
          \ whoever holds the key can leave it out, so for a credential that a customer's\
          \ browser holds, use an editor session. An `Idempotency-Key` is kept apart\
          \ for each managed user."
        explode: false
        in: header
        name: X-Managed-User-Id
        required: false
        schema:
          example: 3f2b8c1e-7a4d-4e0b-9c55-2d1a6b7e8f90
          format: uuid
          type: string
        style: simple
      - description: "Your own id for the managed user (its `externalId`), when you\
          \ do not keep Widgetic's. Makes this call for one of your managed users,\
          \ so that a mistake in your own code cannot reach another customer's work.\
          \ Send this header, or the other one, never both. Left out, the call works\
          \ on your whole account, as it always has. With it, the call reaches only\
          \ that user's compositions: a list shows only theirs, a composition the\
          \ call makes is filed under them, and a composition of another user, or\
          \ one that does not exist, answers `404` (the same answer, so the call cannot\
          \ be used to find out what another customer has). A managed user that is\
          \ not yours answers `404` with `MANAGED_USER_NOT_FOUND`. An empty, repeated\
          \ or malformed header is `400` with `MANAGED_USER_SCOPE_INVALID`; an empty\
          \ header is never read as no header. A call that is about the whole account,\
          \ such as the list of your managed users, is refused with `403` and `MANAGED_USER_SCOPE_ROUTE_NOT_AVAILABLE`:\
          \ send it without the header. Only your API key can send it. The header\
          \ is a limit the call asks for: whoever holds the key can leave it out,\
          \ so for a credential that a customer's browser holds, use an editor session.\
          \ An `Idempotency-Key` is kept apart for each managed user."
        explode: false
        in: header
        name: X-Managed-User-External-Id
        required: false
        schema:
          example: customer-1042
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAllCompositions_200_response'
          description: List of compositions retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A parameter is not valid (for example a `managedUserId` that\
            \ is not a UUID, or both `managedUserId` and `managedUserExternalId`)."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The managed user named by `managedUserId` or `managedUserExternalId`
            is not one of yours (`MANAGED_USER_NOT_FOUND`).
      security:
      - apiKeyAuth: []
      summary: Get All Compositions
      tags:
      - Partner
      - Compositions
      x-access-level: user
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: "import { Configuration, CompositionsApi } from '@widgetic/api-sdk';\n\
          \nconst config = new Configuration({\n  apiKey: 'YOUR_API_KEY'\n});\n\n\
          const compositionsApi = new CompositionsApi(config);\n\ntry {\n  const response\
          \ = await compositionsApi.getAllCompositions({\n    page: 1,\n    size:\
          \ 20,\n    sort: 'createdAt:desc'\n  });\n  \n  // The paging numbers are\
          \ in meta\n  console.log('Compositions:', response.data);\n  console.log('Total:',\
          \ response.meta?.total);\n  console.log('Current page:', response.meta?.page);\n\
          } catch (error) {\n  if (error.response?.status === 401) {\n    console.error('Authentication\
          \ required');\n  } else {\n    console.error('Failed to fetch compositions:',\
          \ error);\n  }\n}\n"
    post:
      description: |
        Creates a new composition.

        To make the composition for one of your managed users, send `managedUserId` or `managedUserExternalId`.
        The composition stays in your account and is yours to edit; the tag lets you list one user's compositions
        with `getAllCompositions`. The managed user must be yours and active: one that is not yours, or does not
        exist, is answered with 404 and `MANAGED_USER_NOT_FOUND`, and one that is switched off with 409 and
        `MANAGED_USER_INACTIVE`. The tag is set here and does not change afterwards. A copy made with
        `duplicateComposition` keeps the tag of the original.

        An editor session with the `creator` surface may call this to start a composition of a widget it built:
        it sends only `name`, `widgetId` (a widget made for the session's managed user) and `content`, and the
        composition is always made for that managed user.

