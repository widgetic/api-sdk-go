openapi: 3.0.0
info:
  description: API documentation for the Widgetic API Gateway
  license:
    name: Widgetic Integration License
    url: https://docs.widgetic.com/resources/license
  title: Widgetic API Gateway
  version: 1.0.0
servers:
- description: Development server
  url: https://api.widgetic.com/v1
  variables:
    env:
      default: development
      description: Environment
    apiUrl:
      default: https://api.widgetic.com
      description: API URL
    apiVersion:
      default: /v1
      description: API Version path prefix
tags:
- description: "Operations a partner integration uses, in one place"
  name: Partner
paths:
  /embed/compositions/{compositionId}/entries/{table}:
    post:
      description: |-
        Public append-only write into a published composition database. No API key. The browser must send a permitted `Origin` header (the artifact iframe origin or a website the owner allowed). When the request comes from the shared artifact origin, it must also carry the per-composition write token (`X-Widgetic-Write-Token` header or `writeToken` body field, handed to the widget in `widgetic:host` as `entries.writeToken` and returned as `entryWriteToken` on `getPublicCompositionEmbed`). Host `context` is stored for partner attribution; it is not authenticated unless the partner signs it (see **Signed context**). Request bodies are limited to 16 KB before parsing.
        **Address.** `https://api.widgetic.com/embed/compositions/{compositionId}/entries/{table}`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
        **Signed context.** A partner that wants to trust `context` (to bill a customer by it, say) makes a signing secret (`rotatePartnerEntryContextSecret`), and its server signs the context it hands to the embed. The signature travels inside `context` as two reserved keys, `widgetic_exp` (UTC seconds, at most seven days ahead) and `widgetic_sig`. The gateway checks them after the `Origin` and before anything else is judged, stored or announced, and keeps and announces the context WITHOUT them. A context that is not signed as the partner requires is refused with 403 `CONTEXT_SIGNATURE_REQUIRED`, `CONTEXT_SIGNATURE_INVALID` or `CONTEXT_SIGNATURE_EXPIRED`; when the check cannot be made just now the answer is a retryable 503 `CONTEXT_SIGNATURE_UNAVAILABLE`, never an unchecked entry. Until a partner makes a secret nothing changes: the two keys are dropped and the rest is taken as it came. A signature is good until its `widgetic_exp` and may be used again until then, so a partner that must count each submission once keeps a unique value of its own (a `submissionId`, say) in the context. The recipe and a test vector are in the description of `rotatePartnerEntryContextSecret`.
      operationId: createPublicCompositionEntry
      parameters:
      - explode: false
        in: path
        name: compositionId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: table
        required: true
        schema:
          type: string
        style: simple
      - description: "Signed per-composition write token handed to the widget in `widgetic:host`\
          \ as `entries.writeToken` (and returned by `GET /embed/compositions/{compositionId}`\
          \ as `entryWriteToken`). Required when the request comes from the shared\
          \ Widgetic artifact origin; verified whenever present."
        explode: false
        in: header
        name: X-Widgetic-Write-Token
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCompositionEntryRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCompositionEntryCreated'
          description: Entry stored
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "Invalid body or values (`ENTRY_BODY_INVALID`, `ENTRY_VALUE_INVALID`,\
            \ `ENTRY_CONTEXT_INVALID`)"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "Origin not allowed (`ORIGIN_NOT_ALLOWED`), per-composition\
            \ write token missing, invalid or expired (`WRITE_TOKEN_REQUIRED`, `WRITE_TOKEN_INVALID`,\
            \ `WRITE_TOKEN_EXPIRED`), or the context is not signed as the partner\
            \ requires (`CONTEXT_SIGNATURE_REQUIRED`, `CONTEXT_SIGNATURE_INVALID`,\
            \ `CONTEXT_SIGNATURE_EXPIRED`)"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Composition unavailable or table not found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Body too large (`PAYLOAD_TOO_LARGE`)
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Not JSON (`UNSUPPORTED_MEDIA_TYPE`)
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Row rejected (`ENTRY_ROW_REJECTED`)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "Rate limited (`RATE_LIMITED`), always with `Retry-After`.\
            \ Three limits answer this way: 20 entries a minute per visitor address\
            \ and composition, 300 a minute per composition, and a day's allowance\
            \ per composition (default 50,000 stored entries in 24 hours; `details.scope`\
            \ is `composition_daily` for that one). Only an entry that was stored\
            \ counts against the day's allowance."
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "Database unavailable or statement timeout, or the gateway\
            \ could not tell just now whether the context must be signed (`CONTEXT_SIGNATURE_UNAVAILABLE`).\
            \ Try again."
      summary: Append a visitor entry through the gateway
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /embed/compositions/{compositionId}:
    get:
      description: |
        Public customer embed lookup. No API key. Used by embed-sdk.js on third-party sites.
        If the composition's owner listed the websites it may appear on (the workspace's domain list, or the `allowedDomains` of a partner the owner administers), a request from any other website is refused with 403 `DOMAIN_NOT_ALLOWED`. The website is read from the `Origin` header, or the host of `Referer` when there is no `Origin`; a request that names neither (a server, a tool) is not refused. An owner who listed nothing is not restricted, and a page on the visitor's own machine (`localhost`, `127.0.0.1` or `[::1]`, on any port) is always allowed. So is the website where a partner integrates Widgetic, with every subdomain of it (`platformDomain` in the answer of `GET /partners/mine`), for the widgets of that partner: a partner's list never has to name it. The list stops other websites from showing the embed in a visitor's browser; it does not hide the published content from someone who holds the composition ID.
        **Address.** `https://api.widgetic.com/embed/compositions/{compositionId}`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
        **Limit.** 500 calls for each visitor address and browser in one counting window, shared with the frame and the status routes. Over it the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      operationId: getPublicCompositionEmbed
      parameters:
      - explode: false
        in: path
        name: compositionId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicCompositionEmbed_200_response'
          description: Published embed URL and optional direct frameless module
          x-response-envelope: raw
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: |
            The composition's owner limited it to the websites they listed, and this request came from another (`code` is `DOMAIN_NOT_ALLOWED`; `details.reason` is `domain_not_allowed` or `opaque_origin`).
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "Composition not found, not published, or embed suspended for\
            \ billing (`code` is `NOT_FOUND`, `UNPUBLISHED` or `SUSPENDED`)."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Embed rate limit exceeded (`code` is `RATE_LIMITED`; the `Retry-After`
            header says when to ask again)
      summary: Resolve a composition UUID to a published widget URL
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /embed/compositions/{compositionId}/frame:
    get:
      description: |
        Public HTML wrapper with an inner published artifact iframe. No API key or SDK required.
        If the composition's owner listed the websites it may appear on, the page is sent with `Content-Security-Policy: frame-ancestors` naming those websites (and Widgetic's own, and the website where the partner the owner administers integrates Widgetic, with its subdomains), so a browser refuses to show it inside any other website whatever `Referer` policy that website uses. Opening the address directly still works. An owner who listed nothing is not restricted.
        **Address.** `https://api.widgetic.com/embed/compositions/{compositionId}/frame`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
      operationId: getPublicCompositionIframe
      parameters:
      - explode: false
        in: path
        name: compositionId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Composition iframe document
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid composition UUID (standard validation response)
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Composition unavailable
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Embed rate limit exceeded (the same count as the lookup route;
            `Retry-After` says when to ask again)
      summary: Embed a published composition with its saved values
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /embed/compositions/status:
    post:
      description: |-
        Public batch health check for embed-sdk.js. No API key. Uses the same serving gate and domain policy as `GET /embed/compositions/{compositionId}`: the caller's website is read from `Origin`, or the host of `Referer` when there is no `Origin`. A request that names neither (a server or tool) is not refused for domain reasons.
        **Address.** `https://api.widgetic.com/embed/compositions/status`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
        **Limit.** The route counts against the same limit as the lookup and the frame routes: 500 calls for each visitor address and browser in one counting window. A call is ONE hit whatever the number of `ids` it carries (up to 100), so a server that checks many compositions spends one call for each hundred of them. A visitor who is over the limit gets 429 `RATE_LIMITED` for the WHOLE call, with a `Retry-After` header and no state for any id: there is no per-composition rate-limit state in the answer.
      operationId: postPublicCompositionEmbedStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postPublicCompositionEmbedStatus_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  statuses:
                    "8baf5703-e134-4c34-94be-4b8616152277": served
              schema:
                $ref: '#/components/schemas/postPublicCompositionEmbedStatus_200_response'
          description: Per-composition embed serve states
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Validation error (no ids, more than 100, or an id that is\
            \ not a UUID)"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: Embed rate limit exceeded. The refusal covers the whole call
            (`code` is `RATE_LIMITED`; the `Retry-After` header says when to ask again).
      summary: Batch-check whether compositions are currently served for embed
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /embed/compositions/{compositionId}/adapters/{adapterId}/{operation}:
    post:
      description: |-
        The door a widget's adapter module calls, from the visitor's browser, for the operations that cannot run in the browser: anything with a secret, a charge in credits or the owner's storage behind it. A widget that uses such an adapter is handed the address of this route as `adapters.url` in its `widgetic:host` message (see the host bridge contract) and calls `{adapters.url}/{adapterId}/{operation}`. It is not meant to be called by hand, and it takes no API key.
        **Address.** `https://api.widgetic.com/embed/compositions/{compositionId}/adapters/{adapterId}/{operation}`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
        **What it serves.** Only an adapter, and a version of it, that the widget's LIVE manifest (what the version that is published uses) lists, and only an operation that runs on the gateway. Anything else is one 404 `ADAPTER_NOT_AVAILABLE`, whatever the reason, so the route is no way to ask what a widget contains. An adapter an administrator stopped offering to NEW widgets keeps serving the widgets that already use it.
        **Who may call.** The same rule as the entry route: a permitted `Origin` header, which is the artifact origin the widget runs from or a website the owner allowed (or the owner's own platform). Page script cannot forge it. A request without a permitted `Origin` is 403 `ORIGIN_NOT_ALLOWED`. A composition that is not served (unpublished, or its owner's plan does not serve it) is 404, with the codes of the other public embed routes. When the partner of the owner signs the host context, a context that is not signed as the partner requires is refused with 403 `CONTEXT_SIGNATURE_REQUIRED`, `CONTEXT_SIGNATURE_INVALID` or `CONTEXT_SIGNATURE_EXPIRED`.
        **Cost and retries.** An operation priced in credits is charged to the owner of the widget (for a customer a partner manages, to the partner's administrator, within the monthly credits set for that customer), once for each `requestId`, before it runs, and given back if it does not answer. A `requestId` that was charged and not given back is 409 `REQUEST_ALREADY_USED` and the operation is NOT run a second time; one whose charge was given back may be tried again with the same `requestId`. A visitor never sees an owner's balance: a feature that cannot be used because its owner has no credits left, because the customer's monthly credits are spent, or because an administrator stopped the adapter, is the same 503 `ADAPTER_UNAVAILABLE` as every other "not right now". The owner is told through a notice.
        **Limits.** In front of everything, 120 calls a minute for each visitor address and composition and 600 a minute for a composition (429 `RATE_LIMITED`). Then, for each operation of a widget, a rate for each visitor address a minute and a cap for the widget a day: 30 and 5000 for an operation that is free, 10 and 500 for one that costs credits, unless the adapter says otherwise (never above 120 and 100000). A visitor over the rate is 429 `RATE_LIMITED`; a widget over its cap is 429 `WIDGET_LIMIT_REACHED`. Both carry a `Retry-After` header. The body is at most 64 KiB (413 `PAYLOAD_TOO_LARGE`) and JSON (415 `UNSUPPORTED_MEDIA_TYPE`); an operation has 30 seconds to answer (504 `ADAPTER_TIMEOUT`, and the charge is given back).
      operationId: callPublicCompositionAdapter
      parameters:
      - explode: false
        in: path
        name: compositionId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The id of the adapter, the name its module is known by, for\
          \ example `upload`."
        explode: false
        in: path
        name: adapterId
        required: true
        schema:
          maxLength: 40
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          type: string
        style: simple
      - description: "The name of one operation of the adapter, as its documentation\
          \ gives it."
        explode: false
        in: path
        name: operation
        required: true
        schema:
          maxLength: 40
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAdapterCallRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallResult'
          description: The operation answered
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The body is not a call (`ADAPTER_BODY_INVALID`: a field that\
            \ is not named here, a `requestId` of another shape, an `input` that is\
            \ not an object), or the operation refused its input with a code of its\
            \ own."
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "Origin not allowed (`ORIGIN_NOT_ALLOWED`), the operation asks\
            \ for a CAPTCHA that is missing or failed (`CAPTCHA_REQUIRED`), or the\
            \ context is not signed as the partner requires (`CONTEXT_SIGNATURE_REQUIRED`,\
            \ `CONTEXT_SIGNATURE_INVALID`, `CONTEXT_SIGNATURE_EXPIRED`)."
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The widget does not use this adapter, this version or this\
            \ operation, or its owner switched it off in the editor (`ADAPTER_NOT_AVAILABLE`),\
            \ or the composition is not there or not served (`NOT_FOUND`, `UNPUBLISHED`,\
            \ `SUSPENDED`; an id that is not a UUID is `NOT_FOUND` too)."
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: This `requestId` was already charged and not given back (`REQUEST_ALREADY_USED`).
            Start a new request.
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "Body too large (`PAYLOAD_TOO_LARGE`), or the operation refused\
            \ an input it cannot take"
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: Not JSON (`UNSUPPORTED_MEDIA_TYPE`)
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The operation refused an input it understood and cannot use,\
            \ with a code of its own"
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: "A limit was reached (`code` is `RATE_LIMITED`, or `WIDGET_LIMIT_REACHED`\
            \ for the widget's daily cap); the `Retry-After` header says when to ask\
            \ again. The body is the standard rate-limit envelope with the flat `code`\
            \ beside it."
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The operation failed (`ADAPTER_FAILED`, or a code of its own);\
            \ any charge was given back"
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The feature cannot be used right now (`ADAPTER_UNAVAILABLE`;\
            \ the cause is never said), or the gateway could not tell whether the\
            \ context must be signed (`CONTEXT_SIGNATURE_UNAVAILABLE`). Try again\
            \ later."
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: The operation took too long (`ADAPTER_TIMEOUT`); any charge
            was given back
      summary: Call a gateway operation of an adapter a published widget uses
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /embed/compositions/{compositionId}/adapters/upload/files/{ticket}:
    put:
      description: |-
        The second of the two calls the `upload` adapter's module makes from the visitor's browser (the first, the `begin-upload` operation of `callPublicCompositionAdapter`, answers with the ticket this route takes). The module sends the file itself, as the body, with its media type as the `Content-Type`. It is not meant to be called by hand, and it takes no API key.
        **Address.** `https://api.widgetic.com/embed/compositions/{compositionId}/adapters/upload/files/{ticket}`: the root of the API host, NOT under `/v1`. A client generated from this description for `https://api.widgetic.com/v1` must be given the base address `https://api.widgetic.com` for the calls of the `Public Embed` tag.
        **The ticket.** Single-use and valid for ten minutes, given for one file: its name, its media type and its exact size are what the visitor said when the ticket was asked for, after the widget's owner's settings (the kinds of file they take, the largest size) were applied. The `Content-Type` and the `Content-Length` of this request must be those, and the body must be exactly that many bytes (400 `UPLOAD_FILE_CHANGED` otherwise). The gateway never believes the type it was told: the first bytes of the file must be a file of that type and one the owner accepts (422 otherwise). A ticket whose file was stored and is sent again is answered with the same file, so a visitor whose connection dropped after the file landed does not store it twice; a ticket whose attempt failed is spent, and the module asks for a new one.
        **What it stores.** The file goes to the widget owner's storage: Widgetic's, or the partner's own bucket for a widget of a customer a partner manages. It counts against the owner's storage allowance and is filed in the folder the owner chose, as a file sent by a visitor, which the owner's own file list leaves out. A full allowance, a partner's storage that cannot be used and a stopped feature are all the same 503 `UPLOAD_UNAVAILABLE` to a visitor, and the owner is told through a notice.
        **Who may call.** The same rule as the entry route: a permitted `Origin` header, which is the artifact origin the widget runs from or a website the owner allowed (or the owner's own platform). A request without a permitted `Origin` is 403 `ORIGIN_NOT_ALLOWED`. A composition that is not served (unpublished, or its owner's plan does not serve it) is 404, with the codes of the other public embed routes.
        **Limits.** 30 requests a minute for each visitor address and composition and 240 a minute for a composition (429 `RATE_LIMITED`, with a `Retry-After` header); at most 10 MB for a file, and only so many files held in memory at once on each gateway process (503 `UPLOAD_BUSY`, with a `Retry-After`). A file that does not arrive within two minutes is 408 `UPLOAD_TIMEOUT`. Every answer but a success closes the connection, so a client that is refused before it has sent the file reads the answer and stops.
      operationId: uploadPublicCompositionAdapterFile
      parameters:
      - explode: false
        in: path
        name: compositionId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The ticket the `begin-upload` operation answered with.
        explode: false
        in: path
        name: ticket
        required: true
        schema:
          maxLength: 128
          minLength: 20
          pattern: "^[A-Za-z0-9_-]{20,128}$"
          type: string
        style: simple
      requestBody:
        content:
          application/pdf:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/aac:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/flac:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/mp4:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/mpeg:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/ogg:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/wav:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          audio/webm:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/gif:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/heic:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/heif:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/jpeg:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/png:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          image/webp:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          video/mp4:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          video/quicktime:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
          video/webm:
            schema:
              $ref: '#/components/schemas/PublicAdapterFileBytes'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterFileResult'
          description: The file is stored
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "What arrived is not the file the ticket was given for (`UPLOAD_FILE_CHANGED`:\
            \ another type, another size, or a body that ended early or ran long)."
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: Origin not allowed (`ORIGIN_NOT_ALLOWED`).
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The ticket is not valid, has expired or belongs to another\
            \ widget (`UPLOAD_TICKET_INVALID`), the widget no longer uses the adapter\
            \ or its owner switched it off (`ADAPTER_NOT_AVAILABLE`), or the composition\
            \ is not there or not served (`NOT_FOUND`, `UNPUBLISHED`, `SUSPENDED`;\
            \ an id that is not a UUID is `NOT_FOUND` too)."
        "408":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: The file did not arrive in time (`UPLOAD_TIMEOUT`).
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: The ticket was already used and its file was not stored (`UPLOAD_TICKET_USED`).
            Ask for a new ticket.
        "411":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The request did not say how long the file is (`UPLOAD_LENGTH_REQUIRED`):\
            \ send `Content-Length`."
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: The file is larger than the owner allows or than the platform
            takes (`UPLOAD_TOO_LARGE`).
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: Not a media type the upload adapter takes (`UNSUPPORTED_MEDIA_TYPE`).
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "The bytes are not a file of the kind they say (`UPLOAD_FILE_UNRECOGNIZED`,\
            \ `UPLOAD_FILE_MISMATCH`), or not a kind this widget's owner accepts (`UPLOAD_TYPE_NOT_ACCEPTED`)."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmbedFailure'
          description: A limit was reached (`code` is `RATE_LIMITED`); the `Retry-After`
            header says when to ask again. The body is the standard rate-limit envelope
            with the flat `code` beside it.
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: The file could not be saved (`UPLOAD_FAILED`).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAdapterCallError'
          description: "Uploads cannot be used right now (`UPLOAD_UNAVAILABLE` or\
            \ `ADAPTER_UNAVAILABLE`; the cause is never said), or every place in memory\
            \ is taken (`UPLOAD_BUSY`). Try again later."
      summary: Send the file a visitor chose through the upload adapter of a published
        widget
      tags:
      - Partner
      - Public Embed
      x-visibility: public
      x-access-level: public
    servers:
    - description: "The public embed routes are served at the root of the API host,\
        \ not under /v1."
      url: https://api.widgetic.com
  /widgets:
    get:
      description: |
        Lists the widgets your account owns, newest first. A widget is the reusable piece a composition is made
        from; this is your own library, not a catalogue of Widgetic's widgets.

        Pass `page` (counting from 1) and `size` (1 to 100, 20 when left out) to read the list one page at a time.
        `meta` then carries `total`, `hasNextPage` and `hasPreviousPage`, so a client can walk the list to its end.
        A page past the end is an empty list. Without `page` and `size` the call returns the whole list in one
        response, which only suits an account with a few widgets.

        Pass `canvasId` to list only the widgets on one of your canvases. That list is always returned whole,
        whatever `page` and `size` say.

        Pass `managedUserId` (Widgetic's id for one of your managed users) or `managedUserExternalId` (your own
        identifier for the user) to list only the widgets made for that managed user. The widgets of your other
        managed users, and your own, are left out. It combines with `page`, `size` and `canvasId`. A managed user
        that is not yours, or does not exist, is answered with 404 and `MANAGED_USER_NOT_FOUND`.
      operationId: getWidgets
      parameters:
      - description: "Page to return, counting from 1. Giving `page` or `size` turns\
          \ paging on."
        explode: true
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - description: How many widgets a page holds (20 when `page` is given without
          it). Giving `page` or `size` turns paging on.
        explode: true
        in: query
        name: size
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: List only the widgets on this canvas. The list is returned whole.
        explode: true
        in: query
        name: canvasId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "List only the widgets made for this managed user (Widgetic's\
          \ id for the user). Send this or `managedUserExternalId`, not both."
        explode: true
        in: query
        name: managedUserId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "List only the widgets made for the managed user you registered\
          \ with this `externalId` (your own identifier for the user). Send this or\
          \ `managedUserId`, not both."
        explode: true
        in: query
        name: managedUserExternalId
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getWidgets_200_response'
          description: List of widgets
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A parameter is not valid (for example `size` above 100, a\
            \ `canvasId` or `managedUserId` that is not a UUID, or both `managedUserId`\
            \ and `managedUserExternalId`)."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key's role may not use this endpoint.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The managed user named by `managedUserId` or `managedUserExternalId`
            is not one of yours (`MANAGED_USER_NOT_FOUND`).
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many requests. See the Retry-After header.
      security:
      - apiKeyAuth: []
      summary: List Widgets
      tags:
      - Partner
      - Widgets
      x-access-level: user
      x-visibility: public
    post:
      description: |
        Creates a widget for your account: a named record with a type and some starting content, on a canvas of
        its own (or one of yours that you name). It costs no credits and has no code yet; the code is generated for
        it afterwards. The new widget is yours, and you can list it with `getWidgets`. A widget is a draft until
        you say otherwise (`isDraft: false`).

        If a step after the widget was saved does not go through, the widget is still created, and
        `data.warnings` says what did not. Read it before relying on the widget.

        A widget can be placed on one of your canvases (`canvasId`), in a project you can edit (`projectId`) or in an
        organization where you may create widgets (`organizationId`). Naming anything you cannot use is refused
        with 403, and the answer is the same whether it exists or not.

        To make the widget for one of your managed users, send `managedUserId` or `managedUserExternalId`. The widget
        stays in your account and is yours to edit; the tag lets you list one user's widgets with `getWidgets`. The
        managed user must be yours and active: one that is not yours, or does not exist, is answered with 404 and
        `MANAGED_USER_NOT_FOUND`, and one that is switched off with 409 and `MANAGED_USER_INACTIVE`. The tag is set
        here and does not change afterwards.

        This call has a limit of its own: 120 per minute for each account (ask Widgetic if you need more). Past
        that the call is answered with 429 and a `Retry-After`. A widget has no database of its own: what the
        visitors of a composition leave is kept in the tables of that composition, made when the composition is.
        The `Idempotency-Key` header is required; send the same key when you retry, so one widget is created, not
        two.
      operationId: createWidget
      parameters:
      - description: A unique value (a UUID is fine) that makes a retry of this request
          safe.
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWidget'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createWidget_201_response'
          description: Widget created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Invalid request, or the `Idempotency-Key` header is missing."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            The key's role may not use this endpoint, or `canvasId`, `projectId` or `organizationId` names
            something you may not use.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The managed user named by `managedUserId` or `managedUserExternalId`
            is not one of yours (`MANAGED_USER_NOT_FOUND`).
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The managed user is switched off, so nothing new can be made\
            \ for it (`MANAGED_USER_INACTIVE`)."
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many widgets created in a minute. See the Retry-After header.
      security:
      - apiKeyAuth: []
      summary: Create Widget
      tags:
      - Partner
      - Widgets
      x-access-level: user
      x-visibility: public
  /widgets/{id}/composition:
    post:
      description: |
        After a managed user publishes a widget from the creator, call this with the widget id, the customer's
        managed user (when the widget is not already filed under one), and optional content, design, embed settings
        and locale. Every input is validated before a single insert; a failure never leaves a half-made composition.

        When the widget is already tagged with a managed user, you may omit `managedUserId`. When you send it, it
        must match that tag.

        A widget that keeps what visitors send (a form, a vote, a rating) declares its tables in its own source
        (`src/lib/meta/database.json`); they are made for the composition here, in a schema of its own, as the widget
        was when it was last published. A widget that keeps nothing leaves the composition without tables. If the
        tables cannot be made just now, or the widget's file cannot be used, the composition is still created (`201`)
        and `meta.warnings` says why; the tables are made the next time the widget is generated.

        The widget must be published. The `Idempotency-Key` header is required.
      operationId: createCompositionFromWidget
      parameters:
      - description: The widget id
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Required: a call without it is refused with `400`. A key of\
          \ your own that names this one request; a UUID is ideal. It is 8 to 50 characters\
          \ of letters, digits, `-` and `_`. Send the same key again when you retry\
          \ (after a timeout, a dropped connection or a `5xx`) and the call is carried\
          \ out once: the retry gets the first answer back, marked `X-Idempotency-Cached:\
          \ true`. The same key with a different body is refused with `422`, and a\
          \ retry that arrives while the first call is still running with `409` (see\
          \ `Retry-After`)."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
          maxLength: 50
          minLength: 8
          pattern: "^[a-zA-Z0-9_-]{8,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              name: Published widget embed
              managedUserId: 123e4567-e89b-12d3-a456-426614174000
              locale: de-DE
            schema:
              $ref: '#/components/schemas/createCompositionFromWidget_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createCompositionFromWidget_201_response'
          description: Composition created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (`VALIDATION_ERROR`)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Widget or managed user not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Managed user inactive or widget not published
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limited
      security:
      - apiKeyAuth: []
      summary: Create a composition for a widget in one call
      tags:
      - Partner
      - Widgets
      x-access-level: user
      x-visibility: public
  /widgets/batch:
    post:
      description: "Retrieves multiple widgets by their IDs in a single request. An\
        \ id that is not found, or that is not yours, is reported in `errors` exactly\
        \ like one that does not exist. Called with an editor session, only the widgets\
        \ made for the session's managed user are returned."
      operationId: getWidgetsBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getWidgetsBatch_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWidgetsBatchResponse'
          description: Widgets batch result
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - apiKeyAuth: []
      summary: Get Widgets Batch
      tags:
      - Partner
      - Widgets
      x-access-level: user
      x-visibility: public
  /users/{id}/workspace/domains:
    get:
      description: |-
        Lists the websites on an account's own list, newest first. It is the list Widgetic checks when a widget of the account is embedded: when it holds at least one website, the widget is shown on those websites (and on Widgetic's own) and nowhere else; when it is empty, the widget can be shown anywhere. If the account administers a partner, the websites set on the partner record by Widgetic are added to them. Widgets that belong to an organization use the organization's list instead.
        The answer holds the whole list, however long it is: a partner's list has no limit.
      operationId: getPersonalWorkspaceDomains
      parameters:
      - description: "The account the list belongs to. For your own, your own user\
          \ id"
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPersonalWorkspaceDomains_200_response'
          description: Every website on the list (an empty list when nothing is restricted)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The list belongs to another account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account was not found
      security:
      - apiKeyAuth: []
      summary: List the websites allowed to show your widgets
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
    post:
      description: |-
        Adds a website to an account's own list. Give a website name such as `example.com`, or `*.example.com` for a website and all of its subdomains. A scheme, a port, a path, capital letters and a leading `www.` are dropped, so `https://www.Example.com/shop` is kept as `example.com`, and `example.com` covers `www.example.com` too. Something that is not a website name is refused, not stored.
        Until the first website is added nothing is restricted, and a widget can be shown anywhere. Once the list has one, a widget of the account is shown on the listed websites (and on Widgetic's own) and nowhere else. A page on your own machine (`localhost`, `127.0.0.1` or `[::1]`, on any port) is always allowed, so there is nothing to add to test locally. So is the website where a partner your account administers integrates Widgetic, with every subdomain of it (`platformDomain` in the answer of `GET /partners/mine`), so there is nothing to add for it either and a list can never lock it out. A change can take about 15 seconds to reach every server.
        The list is a safeguard against other websites showing your widgets in a visitor's browser. It is not access control: anyone who knows a widget's id can still fetch its published content with a plain request that names no website.
        There is no limit on the list of an account that administers a partner, so a partner can add the website of each of its customers as they publish on their own domain, one call each. Any other account can list at most 50 websites, and the 51st is answered with a 409 (`BUSINESS_STATE_CONFLICT`). A wildcard such as `*.example.com` counts as one website, not one per subdomain, so use it instead of listing each subdomain.
        A page that frames a widget can name only so many websites to the browser (about fifty of ordinary length). Past that, the browser no longer checks the list for that page; the lookup that the Embed SDK makes for the widget still refuses every website that is not on the list.
      operationId: addPersonalWorkspaceDomain
      parameters:
      - description: "The account the list belongs to. For your own, your own user\
          \ id"
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalWorkspaceDomainResultResponse'
          description: The website was added
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The text is missing, longer than 255 characters, or not a\
            \ website name"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The list belongs to another account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account was not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The website is already on the list (`RESOURCE_ALREADY_EXISTS`),\
            \ or the account does not administer a partner and its list already holds\
            \ 50 websites (`BUSINESS_STATE_CONFLICT`)"
      security:
      - apiKeyAuth: []
      summary: Allow a website to show your widgets
      tags:
      - Partner
      - Users
      x-access-level: user
      x-visibility: public
