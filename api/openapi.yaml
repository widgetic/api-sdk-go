            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many requests. Wait a minute.
      security:
      - apiKeyAuth: []
      summary: Where your notifications go
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
    put:
      description: |
        Changes who gets the emails, which events you want by email and by webhook, and the address of your webhook.
        A key you leave out of the body is left as it was; send only what changes.

        **Email.** `emailRecipients` is the list of addresses (at most five). While it is empty the emails about
        invoices go to the billing emails of your billing profile (your contact email when there are none), and the
        others to your contact email. The events about money and about the standing of your account are always
        emailed, whatever `emailEvents` says; it narrows the others.

        **Webhook.** `webhookUrl` is where Widgetic sends a signed `POST` for each event, so that your own system
        can act on it (mark an invoice paid, warn your team that credits are low). The address must be `https` on the
        standard port, on a public site, and must not redirect. Setting an address when you have no secret yet makes
        one, and the answer carries it as `webhookSecret`: **keep it now, it is shown once**. `webhookEvents` narrows
        what is sent.

        Each call has a JSON body, `{ "id": "evt_...", "type": "invoice.paid", "createdAt": "...", "partnerId": "...",
        "data": { ... } }` (`data` is the `data` of `PartnerNotification`), and these headers:
        `webhook-id` (the same as `id`, and the same on every retry), `webhook-timestamp` (seconds since 1970) and
        `webhook-signature` (`v1,` and a base64 HMAC-SHA256). It is the Standard Webhooks scheme, so any of its
        libraries verifies it. By hand: take your secret without the `whsec_` prefix, decode it from base64, and sign
        the text `<webhook-id>.<webhook-timestamp>.<the raw body>` with it; the header holds `v1,<base64 of the
        result>` (two signatures separated by a space while a rotated secret overlaps). Reject a `webhook-timestamp`
        that is more than five minutes old.

        Answer with a 2xx status within ten seconds. Anything else is tried again, eight attempts in all over about
        two days (`listPartnerNotificationDeliveries` shows each). Delivery is at least once: if your answer was lost
        the same event arrives again with the same `id`, so drop what you have already handled by it.

        Changing the settings needs an API key with full access: they decide where your notifications go.
        The caller must be the person who administers the partner, or a Widgetic administrator.
      operationId: updatePartnerNotificationSettings
      parameters:
      - description: The partner whose notification settings to change
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Optional: without it the call is carried out every time it is\
          \ sent. A key of your own that names this one request; a UUID is ideal.\
          \ It is 8 to 50 characters of letters, digits, `-` and `_`. Send the same\
          \ key again when you retry (after a timeout, a dropped connection or a `5xx`)\
          \ and the call is carried out once: the retry gets the first answer back,\
          \ marked `X-Idempotency-Cached: true`. The same key with a different body\
          \ is refused with `422`, and a retry that arrives while the first call is\
          \ still running with `409` (see `Retry-After`)."
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          example: 9b2d6f0a-3c41-4e5a-8d77-1f2e3a4b5c6d
          maxLength: 50
          minLength: 8
          pattern: "^[a-zA-Z0-9_-]{8,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerNotificationSettingsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerNotificationSettingsChangeResponse'
          description: The settings were saved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A value is missing, malformed or not allowed (INVALID_NOTIFICATION_SETTINGS).\
            \ `error.details.problems` names each field and says why. Nothing was\
            \ saved."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The caller does not administer this partner, or the API key\
            \ has not full access"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (reported to administrators only)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many changes in a short time. Try again after the Retry-After
            seconds.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Webhooks cannot be set up on this server right now (WEBHOOK_SIGNING_UNAVAILABLE).
            Nothing was changed.
      security:
      - apiKeyAuth: []
      summary: Choose where your notifications go
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, PartnersApi } from '@widgetic/api-sdk';

          const partnersApi = new PartnersApi(new Configuration({ apiKey: 'YOUR_API_KEY' }));

          // Send every payment event to your own system:
          const change = await partnersApi.updatePartnerNotificationSettings({
            partnerId,
            updatePartnerNotificationSettingsRequest: {
              webhookUrl: 'https://example.com/widgetic/events',
              webhookEvents: ['invoice.issued', 'invoice.paid', 'invoice.failed']
            }
          });

          // Shown once: put it in your receiver's configuration now.
          console.log(change.webhookSecret);
  /partners/{partnerId}/notifications/webhook-secret:
