  /invoices/partner/{partnerId}:
    get:
      description: |
        Lists the invoices issued to a partner, newest first. Each carries the price (`subtotal`), the tax on
        it (`taxAmount`) and what is paid (`total`), its status as the payment provider reports it, why the
        last payment failed (`failureReason`), and the page where it is paid (`hostedInvoiceUrl`).

        A partner reads its own: the caller must be the person who administers the partner (an API key of
        that account works), and anyone else is refused with 403 whether or not the partner exists.
        Widgetic administrators can read any partner's and see exactly what the partner sees; the full
        records, with the internal fields, are `getAllInvoices` filtered by partner.

        The page is always bounded: `limit` defaults to 50 and is capped at 100, `offset` defaults to 0.
      operationId: getInvoicesByPartnerId
      parameters:
      - description: The partner whose invoices to list
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Only invoices with this status
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - draft
          - open
          - pending
          - paid
          - failed
          - void
          - uncollectible
          - refunded
          - canceled
          type: string
        style: form
      - description: Maximum number of invoices to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Number of invoices to skip
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getInvoicesByPartnerId_200_response'
          description: "The partner's invoices, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
      security:
      - apiKeyAuth: []
      summary: List a partner's invoices
      tags:
      - Partner
      - Invoices
      x-access-level: partner
      x-visibility: public
