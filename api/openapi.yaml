        The files filed under one managed user. The row with a null `managedUserId` is the files that are not filed under any: your own, and the ones uploaded without naming a managed user.
      example:
        managedUserId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        externalId: Example externalId
        name: Example name
        isActive: true
        fileCount: 42
        totalBytes: 42
        widgeticStorageBytes: 42
        partnerStorageBytes: 42
        lastUploadAt: 2026-01-15T09:30:00.000Z
      properties:
        managedUserId:
          description: Widgetic's id for the managed user. Null for the files that
            are not filed under one.
          format: uuid
