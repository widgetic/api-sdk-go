        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (reported to administrators only)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The partner has no administrator account (PARTNER_HAS_NO_ADMINISTRATOR)
      security:
      - apiKeyAuth: []
      summary: List the widgets a partner offers as presets
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
  /partners/{partnerId}/presets/{key}:
