  /canvases:
    get:
      description: |
        Retrieves all canvases with pagination support and filtering options.

        Pass `managedUserId` (Widgetic's id for one of your managed users) or `managedUserExternalId` (your own
        identifier for the user) to list only the canvases made for that managed user. The canvases of your other
        managed users, and your own, are left out. A managed user that is not yours, or does not exist, is answered
        with 404 and `MANAGED_USER_NOT_FOUND`. Called with an editor session, the list is always the session's
        managed user's.
      operationId: getAllCanvases
      parameters:
      - description: Page number for pagination
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Sort field and direction (e.g., \"created_at:desc\")"
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: created_at:desc
          type: string
        style: form
      - description: Filter canvases created after the specified date (ISO 8601 format)
        explode: true
        in: query
        name: createdAfter
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter canvases created before the specified date (ISO 8601 format)
        explode: true
        in: query
        name: createdBefore
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter canvases updated after the specified date (ISO 8601 format)
        explode: true
        in: query
        name: updatedAfter
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter canvases updated before the specified date (ISO 8601 format)
        explode: true
        in: query
        name: updatedBefore
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "List only the canvases made for this managed user (Widgetic's\
          \ id for the user). Send this or `managedUserExternalId`, not both."
        explode: true
        in: query
        name: managedUserId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "List only the canvases made for the managed user you registered\
          \ with this `externalId` (your own identifier for the user). Send this or\
          \ `managedUserId`, not both."
        explode: true
        in: query
        name: managedUserExternalId
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCanvasesResponse'
          description: List of canvases retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "A parameter is not valid (for example a `managedUserId` that\
            \ is not a UUID, or both `managedUserId` and `managedUserExternalId`)."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The managed user named by `managedUserId` or `managedUserExternalId`
            is not one of yours (`MANAGED_USER_NOT_FOUND`).
      security:
      - apiKeyAuth: []
      summary: Get All Canvases
      tags:
