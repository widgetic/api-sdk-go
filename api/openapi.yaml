        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: There is no such partner (reported to administrators only)
      security:
      - apiKeyAuth: []
      summary: Take a widget off the partner's presets
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
    put:
      description: |
        Offers one of the partner's own widgets as a preset under `key`. If the partner already has a preset under
        that key it is replaced, so sending the same request twice is safe. Saving replaces the whole preset: a
        `title`, `description` or `position` you leave out goes back to its default.

        Keys are 1 to 64 characters: lowercase letters, digits, hyphens and underscores, the first a letter or a
        digit (`rating`, `quiz-3`).

        The widget must belong to the partner's account; a widget that does not exist and one that belongs to
        somebody else are refused in the same way (404 `PRESET_WIDGET_NOT_FOUND`). A widget is a preset under at
        most one key (409 `PRESET_WIDGET_ALREADY_USED`; `details.key` says which), and an account can have at
        most 100 presets (409 `PRESET_LIMIT_REACHED`).

        Later changes to the widget reach new copies and new compositions; copies made earlier are not touched.
        Deleting the widget removes its preset.
      operationId: setPartnerPreset
      parameters:
      - description: The partner whose preset to set
        explode: false
        in: path
        name: partnerId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The name your code uses for the preset
        explode: false
        in: path
        name: key
        required: true
        schema:
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPartnerPresetRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPresetResponse'
          description: The preset as saved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key or a field is malformed or not allowed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The API key is missing or invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not administer this partner
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "There is no such partner, or the widget is not one of yours\
            \ (PRESET_WIDGET_NOT_FOUND)"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "The widget is already a preset under another key (PRESET_WIDGET_ALREADY_USED),\
            \ or the account has 100 presets (PRESET_LIMIT_REACHED)"
      security:
      - apiKeyAuth: []
      summary: "Make a widget a preset, or replace a preset"
      tags:
      - Partner
      - Partners
      x-access-level: partner
      x-visibility: public
