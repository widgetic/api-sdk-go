          \ ManagedUsersApi } from '@widgetic/api-sdk';\n\nconst config = new Configuration({\n\
          \  apiKey: 'YOUR_API_KEY'\n});\n\nconst managedUsersApi = new ManagedUsersApi(config);\n\
          \ntry {\n  const managedUser = await managedUsersApi.createManagedUser(\n\
          \    {\n      newManagedUser: {\n        externalId: \"external-user-123\"\
