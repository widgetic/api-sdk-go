    PartnerNotificationEventType:
      description: What happened. The event types you can be told about.
      enum:
      - invoice.issued
      - invoice.due_soon
      - invoice.overdue
      - invoice.paid
      - invoice.failed
      - credits.low
      - credits.managed_user_cap_reached
      - partner.activated
      - partner.paused
      - partner.resumed
      - storage.check_failed
      - composition.created
      - composition.updated
      - widget.published
      - upload.created
      - entry.created
      type: string
    PartnerNotification:
      description: "One thing that happened to your partner account. The same object\
        \ is what your webhook receives as `data` of a call (beside `id`, `type`,\
        \ `createdAt` and `partnerId`), and what the list in your dashboard shows."
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: null
        title: Example title
        body: Example body
        tone: Example tone
        data: {}
        createdAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/PartnerNotificationEventType'
        title:
          description: One line that says what happened
          type: string
        body:
          description: A few sentences that say what happened and what to do about
            it
          type: string
        tone:
          description: How serious it is
          enum:
          - info
          - success
          - warning
          - error
          type: string
        data:
          additionalProperties: true
          description: "The facts of the event, named in camelCase. An invoice event\
            \ carries `invoiceNumber`, `subtotal`, `taxAmount`, `total`, `currency`,\
            \ `dueDate`, `hostedInvoiceUrl` (the page where it is paid) and `purpose`\
            \ (`contract`, or `extra_credits` for credits you bought on top of the\
            \ contract: an unpaid invoice for extra credits never stops the account,\
            \ the credits are just not added until it is paid); a payment adds `paidAt`,\
            \ a failed payment `reason`, a reminder `daysUntilDue` or `daysOverdue`.\
            \ A credits event carries `band` (`low` or `empty`), `balance` and `threshold`.\
            \ `credits.managed_user_cap_reached` (one of your managed users used its\
            \ monthly credits and a request was refused) goes to your webhook only\
            \ when subscribed, once per managed user each month, and carries `managedUserId`,\
            \ `externalId`, `monthlyCredits`, `creditsUsed`, `resetsAt` and `reachedAt`.\
            \ A standing event carries `status`, `previousStatus` and `reason`; `partner.paused`\
            \ with `status: payment_arrears` means that an overdue invoice stopped\
            \ the account (nobody paused it, and `reason` names the invoice), and\
            \ `partner.resumed` with `previousStatus: payment_arrears` means that\
            \ its payment ended that. A storage event carries `reason` and `checkedAt`.\
            \ Content events (`composition.created`, `composition.updated`, `widget.published`,\
            \ `upload.created`, `entry.created`) go to your webhook only when subscribed;\
            \ they do not appear in the dashboard list. `composition.created` carries\
            \ `compositionId`, `widgetId`, `name`, `managedUserId`, `externalId` and\
            \ `createdAt`; `composition.updated` carries `compositionId`, `widgetId`,\
            \ `name`, `managedUserId`, `externalId`, `contentVersion` and `savedAt`,\
            \ and is sent for the first save of a composition in each five minutes\
            \ (read the composition for its current state); `widget.published` carries\
            \ `widgetId`, `name`, `managedUserId`, `externalId`, `version` and `publishedAt`;\
            \ `upload.created` carries `uploadId`, `name`, `mimeType`, `sizeBytes`,\
            \ `address`, `managedUserId`, `externalId`, `purpose` and `createdAt`;\
            \ `entry.created` carries `compositionId`, `table`, `entryId`, `createdAt`\
            \ and `context` (the host attribution of the embedding page, or null),\
            \ and none of the values the visitor entered: read those with the entries\
            \ routes. Ignore an event type you do not know: more may be added. `sendPartnerNotificationTestEvent`\
            \ sends a sample of every one of them."
          type: object
        createdAt:
          format: date-time
          type: string
      required:
      - body
      - createdAt
      - data
      - id
      - title
      - tone
      - type
      type: object
    PartnerNotificationPage:
      description: "A page of notifications, the newest first."
      example:
        notifications:
        - Example PartnerNotification
        nextBefore: 2026-01-15T09:30:00.000Z
      properties:
        notifications:
          items:
            $ref: '#/components/schemas/PartnerNotification'
          type: array
        nextBefore:
          description: "Send as `before` to get the next, older page. Null when there\
            \ is none."
          format: date-time
          nullable: true
          type: string
      required:
      - nextBefore
      - notifications
      type: object
    PartnerNotificationDelivery:
      description: "One send of one notification, to one email address or to your\
        \ webhook. It stays `pending` while it is being tried again, and ends `delivered`,\
        \ `failed` (given up on) or `cancelled` (nobody wanted it any more, for example\
        \ because the webhook was switched off)."
      example:
        deliveryId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        notificationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        eventType: Example eventType
        title: Example title
        channel: Example channel
        target: Example target
        status: Example status
        attemptCount: 42
        nextAttemptAt: 2026-01-15T09:30:00.000Z
        lastAttemptAt: 2026-01-15T09:30:00.000Z
        deliveredAt: 2026-01-15T09:30:00.000Z
        lastStatusCode: 42
        lastError: Example lastError
        createdAt: 2026-01-15T09:30:00.000Z
        replayOfDeliveryId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      properties:
        deliveryId:
          format: uuid
          type: string
        notificationId:
          format: uuid
          type: string
        eventType:
          description: What the notification was about. Null when the notification
            has been removed.
          nullable: true
          type: string
        title:
          nullable: true
          type: string
        channel:
          enum:
          - email
          - webhook
          type: string
        target:
          description: "The email address, or the host of your webhook (never the\
            \ whole address, which may hold a token)"
          type: string
        status:
          enum:
          - pending
          - delivered
          - failed
          - cancelled
          type: string
        attemptCount:
          type: integer
        nextAttemptAt:
          description: When the next attempt is made. Null once the delivery has ended.
          format: date-time
          nullable: true
          type: string
        lastAttemptAt:
          format: date-time
          nullable: true
          type: string
        deliveredAt:
          format: date-time
          nullable: true
          type: string
        lastStatusCode:
          description: "The HTTP status your webhook answered with at the last attempt,\
            \ when it answered"
          nullable: true
          type: integer
        lastError:
          description: "Why the last attempt failed, in a few words. Never what your\
            \ endpoint replied."
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        replayOfDeliveryId:
          description: "When this row is a manual replay, the earlier delivery it\
            \ sent again"
          format: uuid
          nullable: true
          type: string
      required:
      - attemptCount
      - channel
      - createdAt
      - deliveredAt
      - deliveryId
      - eventType
      - lastAttemptAt
      - lastError
      - lastStatusCode
      - nextAttemptAt
      - notificationId
      - replayOfDeliveryId
      - status
      - target
      - title
      type: object
    PartnerNotificationDeliveryLog:
      description: "How the notifications reached their addresses, the newest first."
      example:
        deliveries:
        - Example PartnerNotificationDelivery
      properties:
        deliveries:
          items:
            $ref: '#/components/schemas/PartnerNotificationDelivery'
          type: array
      required:
      - deliveries
      type: object
    PartnerNotificationEvent:
      description: One kind of event you can be told about.
      example:
        type: null
        group: Example group
        label: Example label
        description: Example description
        alwaysEmailed: true
        delivery: Example delivery
      properties:
        type:
          $ref: '#/components/schemas/PartnerNotificationEventType'
        group:
          enum:
          - payments
          - credits
          - account
          - storage
          - content
          type: string
        label:
          type: string
        description:
          description: One sentence that says when it happens
          type: string
        alwaysEmailed:
          description: "True for money and standing: you are emailed whatever you\
            \ chose, and can narrow only what your own system receives."
          type: boolean
        delivery:
          description: "`all`: email (when chosen), dashboard inbox and webhook. `webhook`:\
            \ signed call only — no email and not listed in the dashboard inbox."
          enum:
          - all
          - webhook
          type: string
      required:
      - alwaysEmailed
      - delivery
      - description
      - group
      - label
      - type
      type: object
    PartnerNotificationDefaultRecipients:
      description: Who gets the emails while you have given no addresses of your own.
      example:
        payments: []
        other: []
      properties:
        payments:
          description: "For the invoice events, the billing emails of your billing\
            \ profile, or your contact email when there are none"
          items:
            type: string
          type: array
        other:
          description: "For every other event, your contact email"
          items:
            type: string
          type: array
      required:
      - other
      - payments
      type: object
    PartnerNotificationSettings:
      description: Where your notifications go. The secret that signs your webhook
        is never part of it.
      example:
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        emailRecipients: []
        defaultEmailRecipients: null
        emailEvents:
        - Example PartnerNotificationEventType
        webhookUrl: Example webhookUrl
        webhookEvents:
        - Example PartnerNotificationEventType
        webhookSecretSet: true
        webhookSecretRotatedAt: 2026-01-15T09:30:00.000Z
        webhookSigningAvailable: true
        events:
        - Example PartnerNotificationEvent
      properties:
        partnerId:
          format: uuid
          type: string
        emailRecipients:
          description: The addresses the emails go to. Empty means the defaults.
          items:
            type: string
          type: array
        defaultEmailRecipients:
          $ref: '#/components/schemas/PartnerNotificationDefaultRecipients'
        emailEvents:
          description: The events you want by email. Null means every event. The events
            marked `alwaysEmailed` are emailed whatever it says.
          items:
            $ref: '#/components/schemas/PartnerNotificationEventType'
          nullable: true
          type: array
        webhookUrl:
          description: Where Widgetic sends a signed call for each event. Null while
            the webhook is switched off.
          nullable: true
          type: string
        webhookEvents:
          description: The events sent to your webhook. Null means every event.
          items:
            $ref: '#/components/schemas/PartnerNotificationEventType'
          nullable: true
          type: array
        webhookSecretSet:
          description: Whether a signing secret exists. Calls are made only when it
            does.
          type: boolean
        webhookSecretRotatedAt:
          description: When the current secret was made
          format: date-time
          nullable: true
          type: string
        webhookSigningAvailable:
          description: "False when this server cannot sign webhooks, in which case\
            \ a webhook cannot be set up yet"
          type: boolean
        events:
          description: "Every event there is, for a settings screen to list"
          items:
            $ref: '#/components/schemas/PartnerNotificationEvent'
          type: array
      required:
      - defaultEmailRecipients
      - emailEvents
      - emailRecipients
      - events
      - partnerId
      - webhookEvents
      - webhookSecretRotatedAt
      - webhookSecretSet
      - webhookSigningAvailable
      - webhookUrl
      type: object
    UpdatePartnerNotificationSettingsRequest:
      description: What to change. A key you leave out is left as it was.
      example:
        emailRecipients: []
        emailEvents:
        - Example PartnerNotificationEventType
        webhookEvents:
        - Example PartnerNotificationEventType
        webhookUrl: Example webhookUrl
      properties:
        emailRecipients:
          description: "The addresses the emails go to, at most five. An empty list\
            \ goes back to the defaults."
          items:
            type: string
          maxItems: 5
          type: array
        emailEvents:
          description: The events you want by email. Null for every event.
          items:
            $ref: '#/components/schemas/PartnerNotificationEventType'
          nullable: true
          type: array
        webhookEvents:
          description: The events to send to your webhook. Null for every event.
          items:
            $ref: '#/components/schemas/PartnerNotificationEventType'
          nullable: true
          type: array
        webhookUrl:
          description: "Where to send the signed calls. It must be an https address\
            \ on the standard port, on a public site, and it must not redirect. Null\
            \ or an empty text switches the webhook off. Setting an address when you\
            \ have no secret yet makes one."
          maxLength: 2000
          nullable: true
          type: string
      type: object
    PartnerNotificationSettingsChange:
      description: "The settings after a change, and the new signing secret when one\
        \ was made."
      example:
        settings: null
        webhookSecret: Example webhookSecret
      properties:
        settings:
          $ref: '#/components/schemas/PartnerNotificationSettings'
        webhookSecret:
          description: "The secret that signs your webhook, in the form your receiver\
            \ is configured with (`whsec_...`). It is in this answer ONLY: keep it\
            \ now, it cannot be read again. Null when the change made no secret."
          nullable: true
          type: string
      required:
      - settings
      - webhookSecret
      type: object
    PartnerNotificationTestEventRequest:
      description: Which kind of event to send a sample of.
      example:
        eventType: null
      properties:
        eventType:
          $ref: '#/components/schemas/PartnerNotificationEventType'
      required:
      - eventType
      type: object
    PartnerNotificationTestEventResult:
      description: "How a test call went. The call was made whether or not your receiver\
        \ took it: read `delivered`."
      example:
        delivered: true
        statusCode: 42
        durationMs: 42
        error: Example error
      properties:
        delivered:
          description: True when your receiver answered with a 2xx status.
          type: boolean
        statusCode:
          description: "The HTTP status your receiver answered with. Null when it\
            \ did not answer (refused, unreachable or too slow)."
          nullable: true
          type: integer
        durationMs:
          description: "How long the call took, in milliseconds. A call is given up\
            \ after ten seconds."
          type: integer
        error:
          description: "Why the call did not arrive, in a few words (`timeout`, `status\
            \ 500`, `unreachable`, a redirect). Never what your receiver replied.\
            \ Left out when it arrived."
          type: string
      required:
      - delivered
      - durationMs
      - statusCode
      type: object
    PartnerEntryContextSigning:
      description: "How the context of your embeds is signed. The secret that signs\
        \ it is never part of this: it is shown once, when it is made."
      example:
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        required: true
        secretSet: true
        secretRotatedAt: 2026-01-15T09:30:00.000Z
        previousSecretValidUntil: 2026-01-15T09:30:00.000Z
        signingAvailable: true
      properties:
        partnerId:
          format: uuid
          type: string
        required:
          description: "True: an entry whose context carries no valid signature is\
            \ refused (403 `CONTEXT_SIGNATURE_REQUIRED`). False: an entry that carries\
            \ a signature is checked, and one that carries none is accepted as before."
          type: boolean
        secretSet:
          description: "Whether you have a signing secret. Until you have, no signature\
            \ is checked and none can be required."
          type: boolean
        secretRotatedAt:
          description: When the current secret was made. Null while there is none.
          format: date-time
          nullable: true
          type: string
        previousSecretValidUntil:
          description: "While you switch to a new secret, when the secret it replaced\
            \ stops being accepted. Null when there is none to wait for."
          format: date-time
          nullable: true
          type: string
        signingAvailable:
          description: "False when this server cannot keep secrets, in which case\
            \ none can be made yet."
          type: boolean
      required:
      - partnerId
      - previousSecretValidUntil
      - required
      - secretRotatedAt
      - secretSet
      - signingAvailable
      type: object
    UpdatePartnerEntryContextSigningRequest:
      example:
        required: true
      properties:
        required:
          description: "True to refuse every entry whose context carries no valid\
            \ signature. False to check the signature of the entries that carry one\
            \ and accept the others, as before."
          type: boolean
      required:
      - required
      type: object
    PartnerEntryContextSecret:
      description: "A new signing secret, and how your signing stands now."
      example:
        signing: null
        secret: Example secret
      properties:
        signing:
          $ref: '#/components/schemas/PartnerEntryContextSigning'
        secret:
          description: "The secret: `ctxsec_` followed by the base64 of 32 random\
            \ bytes. It is shown here, once, and cannot be read again."
          type: string
      required:
      - secret
      - signing
      type: object
    PartnerDataDatabase:
      description: "The Neon database your compositions keep what visitors leave in\
        \ them (votes, ratings, answers, form submissions). The connection string\
        \ and its password are never part of this: they are given once, when the database\
        \ is set."
      example:
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        host: ep-cool-name-123456.eu-central-1.aws.neon.tech
        databaseName: neondb
        roleName: widgetic_data
        verifiedAt: 2026-01-15T09:30:00.000Z
        lastVerificationError: Example lastVerificationError
        lastVerificationFailedAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        partnerId:
          format: uuid
          type: string
        host:
          description: "The Neon host of the database, as it appears in its connection\
            \ string (`ep-....neon.tech`)."
          example: ep-cool-name-123456.eu-central-1.aws.neon.tech
          type: string
        databaseName:
          description: The name of the database in your Neon project.
          example: neondb
          type: string
        roleName:
          description: The role Widgetic connects as.
          example: widgetic_data
          type: string
        verifiedAt:
          description: When the database last passed the check.
          format: date-time
          type: string
        lastVerificationError:
          description: "Why the latest re-check failed, in a sentence you can act\
            \ on. Null when the last check passed."
          nullable: true
          type: string
        lastVerificationFailedAt:
          description: When the latest re-check failed. Null when the last check passed.
          format: date-time
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - databaseName
      - host
      - lastVerificationError
      - lastVerificationFailedAt
      - partnerId
      - roleName
      - updatedAt
      - verifiedAt
      type: object
    SetPartnerDataDatabaseRequest:
      example:
        connectionString: postgresql://widgetic_data:YOUR_PASSWORD@ep-cool-name-123456.eu-central-1.aws.neon.tech/neondb
      properties:
        connectionString:
          description: "The connection string of a Neon database and role you made\
            \ for this, as Neon shows it under Connect: `postgresql://<role>:<password>@ep-<name>.<region>.aws.neon.tech/<database>`.\
            \ Either the direct or the pooled host works. Everything after the database\
            \ name (`?sslmode=...`) is ignored. It is stored encrypted and is never\
            \ returned or logged."
          example: postgresql://widgetic_data:YOUR_PASSWORD@ep-cool-name-123456.eu-central-1.aws.neon.tech/neondb
          format: password
          type: string
          writeOnly: true
      required:
      - connectionString
      type: object
    PartnerDataDatabaseRemoval:
      example:
        removed: true
      properties:
        removed:
          description: False when the partner had no database of its own to remove
          type: boolean
      required:
      - removed
      type: object
    PartnerCustomization:
      description: Partner contract customization for a partner
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        customPrice: 299.99
        customCredits: 5000
        creditPriceUsd: 0.085
        effectiveCreditPriceUsd: 0.085
        periodTotalUsd: 425
        additionalFeatures:
        - Advanced analytics
        - White-label branding
        billingCycle: annual
        minimumCommitmentMonths: 12
        supportSla: 99.9%
        contractStartDate: 2024-01-01
        contractEndDate: 2024-12-31
        notes: Special pricing for strategic partner
        isActiveContract: true
        createdAt: 2026-01-15T09:30:00.000Z
        updatedAt: 2026-01-15T09:30:00.000Z
      properties:
        id:
          description: Unique identifier for the customization
          format: uuid
          type: string
        partnerId:
          description: ID of the partner this customization belongs to
          format: uuid
          type: string
        customPrice:
          description: Custom monthly price override
          example: 299.99
          type: number
        customCredits:
          description: "Credits the partner receives each billing period (`billingCycle`).\
            \ What a period costs is derived from it, see `periodTotalUsd`"
          example: 5000
          type: number
        creditPriceUsd:
          description: "What the partner pays for one credit, in dollars (up to four\
            \ decimals). Null means the list price"
          example: 0.085
          nullable: true
          type: number
        effectiveCreditPriceUsd:
          description: "What one credit costs the partner, in dollars. `creditPriceUsd`\
            \ when the contract names one, the list price otherwise"
          example: 0.085
          type: number
        periodTotalUsd:
          description: "What one billing period costs, in dollars before tax. `customCredits`\
            \ times `effectiveCreditPriceUsd`; null while the contract names no credits"
          example: 425
          nullable: true
          type: number
        additionalFeatures:
          description: Additional features beyond base partner plan
          example:
          - Advanced analytics
          - White-label branding
          items:
            type: string
          type: array
        billingCycle:
          description: Billing cycle for the customization
          enum:
          - monthly
          - quarterly
          - annual
          example: annual
          type: string
        minimumCommitmentMonths:
          description: Minimum commitment period in months
          example: 12
          type: number
        supportSla:
          description: Support SLA percentage
          example: 99.9%
          type: string
        contractStartDate:
          description: Contract start date
          example: 2024-01-01
          format: date
          type: string
        contractEndDate:
          description: Contract end date
          example: 2024-12-31
          format: date
          type: string
        notes:
          description: Admin notes about the customization
          example: Special pricing for strategic partner
          type: string
        isActiveContract:
          description: Whether the contract is currently active
          example: true
          type: boolean
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
      type: object
    AddDomainRequest:
      example:
        domain: example.com
      properties:
        domain:
          description: Domain pattern to allow (supports wildcards like *.example.com)
          example: example.com
          type: string
      required:
      - domain
      type: object
    ManagedUser:
      description: |
        A managed user as the API answers. The answer names its fields in camelCase (`externalId`), and so does the request that creates or changes a managed user; the snake_case spelling (`external_id`) is read too.
      example:
        id: 123e4567-e89b-12d3-a456-426614174000
        managerId: 123e4567-e89b-12d3-a456-426614174001
        externalId: external-user-123
        metadata:
          firstName: John
          lastName: Doe
          role: editor
        isActive: true
        createdAt: 2023-01-01T00:00:00Z
        updatedAt: 2023-01-02T00:00:00Z
      properties:
        id:
          description: Unique identifier for the managed user
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        managerId:
          description: ID of the user who manages this managed user
          example: 123e4567-e89b-12d3-a456-426614174001
          format: uuid
          type: string
        externalId:
          description: Your own identifier for the managed user. Unique among the
            managed users you manage (two different partners may use the same value).
          example: external-user-123
          type: string
        metadata:
          description: Additional metadata for the managed user
          example:
            firstName: John
            lastName: Doe
            role: editor
          type: object
        isActive:
          description: |
            Whether new compositions, widgets and uploads can be filed under this managed user. `false` means it has been switched off (`updateManagedUser` with `is_active: false`): what it already has stays, and filing anything new under it answers `409 MANAGED_USER_INACTIVE`. A record from before the switch existed may answer `null`, which counts as on.
          example: true
          nullable: true
          type: boolean
        createdAt:
          description: Timestamp when the managed user was created
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        updatedAt:
          description: Timestamp when the managed user was last updated
          example: 2023-01-02T00:00:00Z
          format: date-time
          type: string
      required:
      - createdAt
      - externalId
      - id
      - managerId
      - updatedAt
      type: object
    NewManagedUser:
      example:
        externalId: external-user-123
        managerId: 123e4567-e89b-12d3-a456-426614174001
        metadata:
          firstName: John
          lastName: Doe
          role: editor
      properties:
        externalId:
          description: Your own identifier for the managed user. Must be unique among
            the managed users you manage (409 otherwise); another partner using the
            same value does not matter.
          example: external-user-123
          type: string
        managerId:
          description: "ID of the user who will manage this managed user. Defaults\
            \ to your own user ID; a partner can only use their own ID (403 otherwise),\
            \ only an admin can name another manager."
          example: 123e4567-e89b-12d3-a456-426614174001
          format: uuid
          type: string
        metadata:
          description: Additional metadata for the managed user
          example:
            firstName: John
            lastName: Doe
            role: editor
          type: object
      required:
      - externalId
      type: object
    UpdateManagedUser:
      example:
        externalId: updated-external-user-123
        metadata:
          firstName: John
          lastName: Smith
          role: admin
        isActive: false
      properties:
        externalId:
          description: Updated external identifier for the managed user. Must be unique
            among the managed users you manage (409 otherwise).
          example: updated-external-user-123
          type: string
        metadata:
          description: Updated additional metadata for the managed user
          example:
            firstName: John
            lastName: Smith
            role: admin
          type: object
        isActive:
          description: |
            Switch the managed user off (`false`) or back on (`true`). A managed user that is off keeps everything already filed under it, and that content can still be listed, but nothing new can be filed under it (`409 MANAGED_USER_INACTIVE`). Send a real boolean, not the text "false". Switching a managed user off also ends all of its editor sessions.
          example: false
          type: boolean
      type: object
    NewEditorSession:
      example:
        surfaces:
        - files
        - editor
        expiresInSeconds: 3600
        allowedOrigin: https://app.example.com
        maxCredits: 20
      properties:
        surfaces:
          description: |
            The pieces of Widgetic's editor the session may drive. `files` is the media library (the File Browser: upload a file, list the files uploaded for this user); what a user uploads is kept in your own storage destination. Partner storage is not optional: a session of any surface can be made only once you have set a destination up (`setPartnerStorageDestination`), and is refused with `409 PARTNER_STORAGE_REQUIRED` until then. `editor` is editing one of this user's compositions: read it, change its name, content, design and embed settings, read its schemas, and ask where to show it (`getCompositionPreview`: the widget's published page). `creator` is Widgetic's widget creator, with its drawing canvas and its AI: this user's canvases, the widgets on them and the conversation of each widget, the generation, build and publish calls that make a widget, and the compositions of those widgets (list, make). The surfaces do not imply one another: the whole creator also saves a composition (`editor`) and attaches pictures to its chat (`files`), so ask for `["creator", "editor", "files"]`.
          example:
          - files
          - editor
          items:
            enum:
            - files
            - editor
            - creator
            type: string
          minItems: 1
          type: array
        expiresInSeconds:
          default: 3600
          description: "How long the session lasts, in seconds. It cannot be extended;\
            \ make a new session when it ends."
          example: 3600
          maximum: 14400
          minimum: 60
          type: integer
        allowedOrigin:
          description: |
            Bind the session to one web page origin, such as `https://app.example.com` (no path; `http` is accepted only for `localhost`). The session is then refused from any other origin, and from a request that carries no `Origin` header. Leave it out for a session that can be used from anywhere, which is what a server-side caller needs.
          example: https://app.example.com
          nullable: true
          type: string
        maxCredits:
          description: |
            The most credits this session may spend on Widgetic's AI, one credit being one generation. Once the operations it ran have taken that many, the next one is refused (402, `EDITOR_SESSION_CREDIT_LIMIT_REACHED`) and the browser is only told that the feature is not available right now. A generation that fails is refunded and does not count. Leave it out to get the limit Widgetic has set for your account, if it has set one (it sets none unless you ask), and otherwise no limit of its own, which leaves the credits of your account as the only ceiling. Send `null` to ask for no limit of its own even when a default is set.
          example: 20
          maximum: 1000000
          minimum: 1
          type: integer
      required:
      - surfaces
      type: object
    EditorSession:
      description: |
        An editor session you have just made. `token` is shown once and cannot be read again: hand it to the browser of this one user and keep it out of logs and storage.
      example:
        token: wgt_ses_3q2-7wA9vJm5cH1xT0uY8pZkR4nLd6BfGeSoVi2tMqE
        sessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        managedUserId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        managedUserExternalId: Example managedUserExternalId
        surfaces: []
        allowedOrigin: Example allowedOrigin
        maxCredits: 42
        expiresAt: 2026-01-15T09:30:00.000Z
        createdAt: 2026-01-15T09:30:00.000Z
      properties:
        token:
          description: |
            The credential the browser sends as `Authorization: Bearer <token>`. It starts with `wgt_ses_`. It works only for the calls of the session's surfaces, only for this managed user's content, and only until `expiresAt`.
          example: wgt_ses_3q2-7wA9vJm5cH1xT0uY8pZkR4nLd6BfGeSoVi2tMqE
          type: string
        sessionId:
          description: "Identifies the session, so you can end it (`revokeManagedUserEditorSession`).\
            \ It is not a credential."
          format: uuid
          type: string
        managedUserId:
          format: uuid
          type: string
        managedUserExternalId:
          description: Your own identifier for the managed user
          type: string
        surfaces:
          items:
            enum:
            - files
            - editor
            - creator
            type: string
          type: array
        allowedOrigin:
          description: "The web page origin the session is bound to, or null when\
            \ it is not bound"
          nullable: true
          type: string
        maxCredits:
          description: "The most credits the session may spend on Widgetic's AI (`max_credits`),\
            \ or null when it has no limit of its own"
          nullable: true
          type: integer
        expiresAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
      required:
      - createdAt
      - expiresAt
      - managedUserExternalId
      - managedUserId
      - sessionId
      - surfaces
      - token
      type: object
    ManagedUserOperationUsage:
      description: What one metered operation cost a managed user's editor sessions
        over the period
      example:
        operation: agent.code.generate
        calls: 42
        credits: 42
        refundedCalls: 42
        refundedCredits: 42
      properties:
        operation:
          description: "The metered operation, as the credit ledger names it"
          example: agent.code.generate
          type: string
        calls:
          description: How many runs of the operation were paid for and kept (a run
            that was refunded is not one)
          type: integer
        credits:
          description: The credits those runs took from your account
          type: integer
        refundedCalls:
          description: "How many runs were refunded (a generation that failed), and\
            \ so are not in `calls`"
          type: integer
        refundedCredits:
          description: "The credits the refunded runs took, which went back to your\
            \ account"
          type: integer
      required:
      - calls
      - credits
      - operation
      - refundedCalls
      - refundedCredits
      type: object
    ManagedUserUsage:
      description: |
        What a managed user's editor sessions spent over a period. Only credits taken through editor sessions are counted, from the day usage was first recorded: what you spend with your API key is not, and neither is anything from before.
      example:
        managedUserId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        managedUserExternalId: Example managedUserExternalId
        from: 2026-01-15T09:30:00.000Z
        to: 2026-01-15T09:30:00.000Z
        totals: {}
        operations:
        - Example ManagedUserOperationUsage
      properties:
        managedUserId:
          format: uuid
          type: string
        managedUserExternalId:
          description: Your own identifier for the managed user
          type: string
        from:
          description: "Start of the period, included"
          format: date-time
          type: string
        to:
          description: "End of the period, not included"
          format: date-time
          type: string
        totals:
          $ref: '#/components/schemas/ManagedUserUsage_totals'
        operations:
          description: "One entry for each operation that was paid for in the period,\
            \ in alphabetical order"
          items:
            $ref: '#/components/schemas/ManagedUserOperationUsage'
          type: array
      required:
      - from
      - managedUserExternalId
      - managedUserId
      - operations
      - to
      - totals
      type: object
    CopyPartnerPresetRequest:
      additionalProperties: false
      example:
        name: Example name
      properties:
        name:
          description: "Names the copy. Left out, the copy is named after the preset's\
            \ title, or the widget's own name."
          maxLength: 120
          minLength: 1
          type: string
      type: object
    PartnerPresetCopy:
      description: Where the copy of a preset is. Open the widget creator on `canvasId`
        and `widgetId`.
      example:
        presetKey: rating
        managedUserId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        canvasId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        widgetId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        widgetName: Example widgetName
        warnings: []
      properties:
        presetKey:
          example: rating
          type: string
        managedUserId:
          description: The managed user the copy was made for
          format: uuid
          type: string
        canvasId:
          description: The new canvas the copy is on
          format: uuid
          type: string
        widgetId:
          description: "The new widget, which is not a preset and which only this\
            \ managed user's editor reaches"
          format: uuid
          type: string
        widgetName:
          type: string
        warnings:
          description: Things that did not go as planned but did not stop the copy.
            Empty when everything did.
          items:
            type: string
          type: array
      required:
      - canvasId
      - managedUserId
      - presetKey
      - warnings
      - widgetId
      - widgetName
      type: object
    ManagedUserLimits:
      description: The monthly credit cap of one managed user and what the user's
        editor sessions spent against it this month.
      example:
        monthlyCredits: 42
        creditsUsedThisMonth: 42
        creditsLeftThisMonth: 42
        resetsAt: 2026-01-15T09:30:00.000Z
      properties:
        monthlyCredits:
          description: "The cap, or null when there is no monthly cap"
          nullable: true
          type: integer
        creditsUsedThisMonth:
          type: integer
        creditsLeftThisMonth:
          nullable: true
          type: integer
        resetsAt:
          description: First instant of the next UTC calendar month
          format: date-time
          type: string
      required:
      - creditsLeftThisMonth
      - creditsUsedThisMonth
      - monthlyCredits
      - resetsAt
      type: object
    DesignDefaults:
      description: A stored design default. A partner has one for all its customers
        and each managed user can have one of its own.
      example:
        design: {}
      properties:
        design:
          additionalProperties: true
          description: "The stored design document, or null when none is set."
          nullable: true
          type: object
      required:
      - design
      type: object
    ManagedUserRemoval:
      description: What a removal of something that belongs to a managed user answers.
      example:
        message: Editor session ended
        id: Example id
      properties:
        message:
          example: Editor session ended
          type: string
        id:
          description: The id of what was removed.
          type: string
      required:
      - id
      - message
      type: object
    PurposeStorageBucket:
      example:
        bytes: 42
        fileCount: 42
      properties:
        bytes:
          type: integer
        fileCount:
          type: integer
      required:
      - bytes
      - fileCount
      type: object
    PartnerInvoice:
      description: |
        An invoice issued to a partner. Money is in dollars (not cents). Administrator notes, billing-provider identifiers and Widgetic account ids are not part of what a partner is sent.
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        partnerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        number: Example number
        description: Example description
        amount: 42
