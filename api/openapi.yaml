      - Canvases
      x-resource-path: canvases
      x-access-level: user
      x-visibility: public
      x-code-samples:
      - lang: TypeScript
        label: TypeScript SDK
        source: |
          import { Configuration, CanvasesApi } from '@widgetic/api-sdk';

          const config = new Configuration({
            apiKey: 'YOUR_API_KEY'
          });

          const canvasesApi = new CanvasesApi(config);

          try {
            const { data, total } = await canvasesApi.getAllCanvases({
              page: 1,
              size: 20
