            as `table` to read it.
          example: ratings
          type: string
        columns:
          description: "The table's columns, in table order (up to 40)"
          items:
            $ref: '#/components/schemas/CompositionEntryColumn'
          type: array
        rows:
          description: "How many entries the table holds. `null` when they could not\
            \ be counted, which is not zero."
          example: 212
          minimum: 0
          nullable: true
