      description: "Checks content against the composition's widget schema without\
        \ saving it. Send what a content update (`PUT /compositions/{id}/content`)\
        \ would store, `{ \"design\": {...}, \"content\": {...} }`, or the widget's\
        \ values alone. Each value is checked by the kind of field the widget declares\
        \ for it: text, a number within the limits of its slider, true or false, one\
        \ of the choices of a dropdown, a color, a font, the address of an image,\
        \ a date. The items of the widget's list are checked the same way, and their\
        \ number against the limits of the list. A value that cannot be what the field\
        \ holds, or a number outside its range, is an error and `valid` is false.\
        \ Text longer than the field takes, a number or true/false sent as text, and\
        \ a name the widget has no field for are warnings, and `valid` stays true.\
        \ The design is not checked here. Nothing is saved and nothing in the body\
        \ is changed."
