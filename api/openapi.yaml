    CompositionEntryTally:
      example:
        value: "5"
        count: 87
      properties:
        value:
          description: |
            One value of the column, as text (a number is `"5"`, a yes/no is `"true"`), cut to 200 characters.
            `null` groups the entries that left the column empty.
          example: "5"
          nullable: true
          type: string
        count:
          description: How many entries have that value
          example: 87
          minimum: 1
          type: integer
      required:
      - count
      - value
      type: object
    CompositionEntriesReading:
      example:
        compositionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        table: Example table
        totalRows: 212
        tallies:
        - Example CompositionEntryTally
        moreGroups: true
        columns:
        - id
        - stars
        - comment
        - created_at
        rows:
        - - 5
          - 5
          - Loved it
          - 2026-10-05T10:00:00Z
        moreRows: true
        aggregates: null
      properties:
        compositionId:
          description: The composition whose entries these are
          format: uuid
          type: string
        table:
          description: The table that was read
          type: string
        totalRows:
          description: |
            How many entries the table holds in all. Not narrowed by `since`, `until` or a filter: only
            `aggregates` is.
          example: 212
          minimum: 0
          type: integer
        tallies:
          description: |
            How many entries have each value of the `groupBy` column, largest group first (up to 20 groups), over
            the whole table. `null` when no `groupBy` was asked for. For the groups of a selection (a time window,
            a `context` filter) or for more than 20 groups, ask for `aggregate`: `aggregates.tallies` holds up to
            200 groups.
          items:
            $ref: '#/components/schemas/CompositionEntryTally'
          nullable: true
          type: array
        moreGroups:
          description: |
            True when the `groupBy` column has more than the 20 groups `tallies` lists. It speaks of `tallies`
            only: `aggregates.truncated` is the same signal for `aggregates` (200 groups).
          type: boolean
        columns:
          description: |
            The name of each value of an entry in `rows`, in order, exactly as the database spells it (and as
            `describeCompositionEntries` lists it: `created_at` stays `created_at`). Empty when no entries were
            asked for, or the table has none.
          example:
          - id
          - stars
          - comment
          - created_at
          items:
            type: string
          type: array
        rows:
          description: |
            The newest entries, newest first (up to 25). `null` when no entries were asked for. Each entry is a
            list of values in the order of `columns`. A value is text (cut to 200 characters), a number, a
            boolean or `null`.
          example:
          - - 5
            - 5
            - Loved it
            - 2026-10-05T10:00:00Z
          items:
            items:
              description: "A text, a number, a boolean or null"
              nullable: true
            type: array
          nullable: true
          type: array
        moreRows:
          description: True when the table holds more entries than `rows` lists
          type: boolean
        aggregates:
          allOf:
          - $ref: '#/components/schemas/CompositionEntryAggregatesBlock'
          description: |
            Only present when the read asked for `aggregate`. Unlike `totalRows`, `tallies` and `rows`, it is
            narrowed by `since`, `until` and the `context` and column filters of the same call: it answers
            "the average rating this week" where `tallies` answer "how many of each rating, ever".
      required:
      - columns
      - compositionId
      - moreGroups
      - moreRows
      - rows
      - table
      - tallies
      - totalRows
      type: object
    CompositionDataSource:
      description: |
        The public JSON address a composition's widget reads when it loads and again every `refreshSeconds`. One
        per composition: binding another replaces it. It is sent and answered as `refreshSeconds`
        (`refresh_seconds` is read too).
      example:
        url: https://example.com/data/results.json
        refreshSeconds: 60
      properties:
        url:
          description: "The https address as it was saved, after the checks (a public\
            \ host, never loopback, link-local or a metadata address)"
          example: https://example.com/data/results.json
          maxLength: 2048
          type: string
        refreshSeconds:
          description: "How often the widget reads the address again, in seconds"
          example: 60
          maximum: 86400
          minimum: 10
          type: integer
      required:
      - refreshSeconds
      - url
      type: object
