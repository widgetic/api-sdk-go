          colors:
            primary: '#0044cc'
        databaseSchema: {}
        projectId: 123e4567-e89b-12d3-a456-426614174004
      properties:
        name:
          description: Updated name of the composition
          example: Updated Composition Name
          type: string
        widgetId:
          description: Updated widget ID
          example: 123e4567-e89b-12d3-a456-426614174002
          format: uuid
          type: string
        content:
          description: Updated content data
          example:
            key: new value
          type: object
        status:
          description: Updated status
          example: published
          type: string
        embedSettings:
          description: Updated embed settings
          example:
            width: 100%
            height: 600px
          type: object
        design:
          description: Updated design settings
          example:
            theme: dark
            colors:
              primary: '#0044cc'
          type: object
        databaseSchema:
          description: |
            Tables to make for the composition, in the shape `createComposition` takes
            (`{ "tables": [ ... ] }`, with the same names, types, defaults and limits). Only the tables that are
            missing are made. A table that already exists is never changed or dropped: it keeps its columns, so a
            column added to the declaration is not added to it. A declaration that cannot be used is refused with
            `400` and `INVALID_DATABASE_SCHEMA`. When the composition is saved but its tables cannot be made just
            now, `meta.warnings` says so: send the same `databaseSchema` again to retry.
          type: object
        projectId:
          description: Updated project ID
          example: 123e4567-e89b-12d3-a456-426614174004
          format: uuid
          type: string
      type: object
    CompositionVersion:
      example:
        id: 123e4567-e89b-12d3-a456-426614174010
